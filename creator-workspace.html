<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI工作台</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    /* color — light */
    --bg: #f7fbff;
    --sidebar-bg: #ffffff;
    --card-bg: #ffffff;
    --overlay-bg: rgba(20, 30, 45, 0.4);
    --primary: #4a9eff;
    --primary-hover: #3a8eef;
    --primary-light: #e8f2ff;
    --primary-soft: #f0f7ff;
    --text-main: #2c3e50;
    --text-sub: #8da0b3;
    --text-muted: #b0c4d8;
    --border: #eef4fb;
    --shadow: 0 2px 12px rgba(74, 158, 255, 0.06);
    --shadow-hover: 0 4px 20px rgba(74, 158, 255, 0.12);
    --shadow-pop: 0 8px 40px rgba(0, 0, 0, 0.15);
    --danger: #ff6b6b;
    --success: #52c41a;
    --warning: #faad14;
    --success-soft: #e8f8ee;
    --warning-soft: #fff7e6;
    --danger-soft: #fff0f0;
    --neutral-soft: #f0f0f0;
    --skeleton-base: #eef4fb;
    --skeleton-shine: #f8fcff;

    /* shape */
    --radius: 16px;
    --radius-sm: 10px;

    /* spacing scale (4px base) */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
    --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-9: 36px; --sp-10: 40px;

    /* typography scale */
    --fs-display: 28px;
    --fs-h1: 22px;
    --fs-h2: 15px;
    --fs-body: 14px;
    --fs-small: 13px;
    --fs-caption: 12px;
    --fs-micro: 11px;

    /* z-index convention */
    --z-nav: 100;
    --z-drawer: 200;
    --z-backdrop: 190;
    --z-modal: 1000;
    --z-palette: 1100;
    --z-onboard: 1200;
    --z-toast: 2000;
  }

  [data-theme="dark"] {
    --bg: #0f141b;
    --sidebar-bg: #151c26;
    --card-bg: #1a2330;
    --overlay-bg: rgba(0, 0, 0, 0.55);
    --primary: #5aa9ff;
    --primary-hover: #7dbdff;
    --primary-light: #1d2f45;
    --primary-soft: #1b2839;
    --text-main: #e6edf5;
    --text-sub: #9db0c4;
    --text-muted: #5c7089;
    --border: #24303f;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.45);
    --shadow-pop: 0 8px 40px rgba(0, 0, 0, 0.6);
    --success-soft: #16301f;
    --warning-soft: #35290e;
    --danger-soft: #3a1d1d;
    --neutral-soft: #232d3b;
    --skeleton-base: #223041;
    --skeleton-shine: #2b3c50;
  }

  /* ============================================================
     BASE
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }

  :focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ============================================================
     SIDEBAR
     ============================================================ */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
    transition: background 0.2s ease, transform 0.25s ease;
    z-index: var(--z-nav);
  }

  .sidebar-header {
    padding: var(--sp-7) var(--sp-6) var(--sp-5);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-header .logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4a9eff, #7db8ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
  }

  .sidebar-header .title { font-size: 16px; font-weight: 600; color: var(--text-main); }
  .sidebar-header .subtitle { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 1px; }

  .sync-indicator {
    margin: 0 var(--sp-4) var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--sp-2);
    font-size: var(--fs-micro);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
    cursor: default;
  }
  .sync-indicator.connected { background: var(--success-soft); color: var(--success); }
  .sync-indicator.saving { background: var(--primary-soft); color: var(--primary); }
  .sync-indicator.local { background: var(--warning-soft); color: var(--warning); }
  .sync-indicator.offline { background: var(--neutral-soft); color: var(--text-muted); }
  .sync-indicator.error { background: var(--danger-soft); color: var(--danger); cursor: pointer; }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  .sync-indicator.connected .sync-dot { background: var(--success); }
  .sync-indicator.saving .sync-dot { background: var(--primary); animation: pulse 0.8s infinite; }
  .sync-indicator.local .sync-dot { background: var(--warning); }
  .sync-indicator.offline .sync-dot { background: var(--text-muted); animation: none; }
  .sync-indicator.error .sync-dot { background: var(--danger); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .menu-scroll { flex: 1; overflow-y: auto; }

  .menu-group { padding: var(--sp-2) var(--sp-3); }

  .menu-group-label {
    font-size: var(--fs-micro); color: var(--text-muted);
    padding: var(--sp-2) var(--sp-3) 6px; letter-spacing: 1px; font-weight: 500;
  }

  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px var(--sp-3); border-radius: var(--radius-sm);
    cursor: pointer; font-size: var(--fs-body); color: var(--text-sub);
    transition: all 0.2s ease; margin-bottom: 2px; user-select: none;
    min-height: 38px;
  }

  .menu-item .icon {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .menu-item:hover { background: var(--primary-soft); color: var(--text-main); }

  .menu-item.active {
    background: var(--primary); color: #fff; font-weight: 500;
    box-shadow: 0 2px 8px rgba(74, 158, 255, 0.3);
  }
  .menu-item.active .icon { color: #fff; }

  .sidebar-footer {
    padding: var(--sp-3) var(--sp-4) var(--sp-5);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }

  .theme-toggle {
    flex: 1;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: transparent; color: var(--text-sub);
    font-size: var(--fs-caption); cursor: pointer; font-family: inherit;
    transition: all 0.2s;
    min-height: 36px;
  }
  .theme-toggle:hover { background: var(--primary-soft); color: var(--text-main); }

  .kbd-hint {
    font-size: var(--fs-micro); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 7px; cursor: pointer; background: transparent; font-family: inherit;
    transition: all 0.2s;
  }
  .kbd-hint:hover { color: var(--primary); border-color: var(--primary); }

  /* Hamburger (mobile) */
  .hamburger {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: var(--z-drawer);
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text-main);
    font-size: 18px; cursor: pointer; box-shadow: var(--shadow);
    align-items: center; justify-content: center;
  }

  .drawer-backdrop {
    display: none;
    position: fixed; inset: 0; z-index: var(--z-backdrop);
    background: var(--overlay-bg);
    opacity: 0; transition: opacity 0.25s;
  }
  .drawer-backdrop.show { opacity: 1; }

  /* ============================================================
     MAIN
     ============================================================ */
  .main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-8) var(--sp-9) 120px; }
  .bottom-spacer { height: 80px; }

  .page-enter { animation: pageIn 0.22s ease; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-header { margin-bottom: var(--sp-6); display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-4); flex-wrap: wrap; }
  .main-header h1 { font-size: var(--fs-h1); font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
  .main-header .date { font-size: var(--fs-small); color: var(--text-muted); }
  .header-actions { display: flex; gap: var(--sp-2); }

  /* ============================================================
     CARDS
     ============================================================ */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: var(--sp-5);
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
    border: 1px solid var(--border);
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-4); gap: var(--sp-2); }
  .card-title { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-h2); font-weight: 600; color: var(--text-main); }
  .card-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

  .card-tag {
    font-size: var(--fs-micro); padding: 3px 10px; border-radius: 20px;
    background: var(--primary-light); color: var(--primary); font-weight: 500;
    white-space: nowrap;
  }

  .card-actions { display: flex; gap: 6px; }
  .card-btn {
    width: 26px; height: 26px; border-radius: 7px; border: none;
    background: var(--primary-soft); color: var(--primary); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .card-btn:hover { background: var(--primary); color: #fff; }

  /* ============================================================
     TASK LIST
     ============================================================ */
  .task-list { list-style: none; }
  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: var(--sp-2) 0; font-size: var(--fs-small); color: var(--text-sub);
    position: relative;
    animation: itemIn 0.25s ease both;
  }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-checkbox {
    width: 18px; height: 18px; border: 2px solid var(--text-muted);
    border-radius: 5px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .task-checkbox.done { background: var(--primary); border-color: var(--primary); color: #fff; font-size: var(--fs-micro); }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text-muted); }

  .task-text { flex: 1; cursor: pointer; }
  .task-text-edit {
    flex: 1; border: 1px solid var(--primary); border-radius: 5px;
    padding: 2px 6px; font-size: var(--fs-small); font-family: inherit;
    color: var(--text-main); outline: none; background: var(--card-bg);
  }

  .task-delete {
    opacity: 0; width: 22px; height: 22px; border-radius: 5px; border: none;
    background: transparent; color: var(--danger); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s; flex-shrink: 0;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: var(--danger-soft); }

  .add-task-row {
    display: flex; gap: var(--sp-2); margin-top: var(--sp-2);
  }
  .add-task-input {
    flex: 1; border: 1px dashed var(--text-muted); border-radius: var(--sp-2);
    padding: 7px var(--sp-3); font-size: var(--fs-small); font-family: inherit;
    color: var(--text-main); outline: none; transition: border-color 0.2s;
    background: transparent; min-width: 0;
  }
  .add-task-input:focus { border-style: solid; border-color: var(--primary); }
  .add-task-input::placeholder { color: var(--text-muted); }

  .add-task-input.input-error {
    border-color: var(--danger); border-style: solid;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .inspire-add-form {
    display: flex; flex-direction: column; gap: var(--sp-2); margin-top: 10px;
    width: 100%; box-sizing: border-box;
  }
  .inspire-add-form .add-task-input {
    width: 100%; box-sizing: border-box; min-width: 0;
  }
  .inspire-add-form .add-btn { align-self: flex-end; }

  .add-btn {
    padding: 7px 14px; border-radius: var(--sp-2); border: none;
    background: var(--primary); color: #fff; font-size: var(--fs-small);
    cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap;
  }
  .add-btn:hover { background: var(--primary-hover); }
  .add-btn:disabled { background: var(--text-muted); cursor: not-allowed; }

  .clear-done-row {
    margin-top: var(--sp-2);
    text-align: right;
  }
  .clear-done-btn {
    border: none; background: transparent; color: var(--text-muted);
    font-size: var(--fs-caption); cursor: pointer; font-family: inherit;
    padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
  }
  .clear-done-btn:hover { color: var(--danger); background: var(--danger-soft); }

  /* ============================================================
     PROGRESS RING / BARS
     ============================================================ */
  .progress-ring { display: flex; align-items: center; gap: var(--sp-5); }
  .ring-svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--primary-soft); }
  .ring-fill { stroke: var(--primary); transition: stroke-dashoffset 0.6s ease; stroke-linecap: round; }

  .ring-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
  .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .ring-percent { font-size: var(--fs-h1); font-weight: 700; color: var(--primary); }
  .ring-label { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }

  .progress-info { flex: 1; }
  .progress-info .label { font-size: var(--fs-small); color: var(--text-sub); margin-bottom: 4px; }
  .progress-info .value { font-size: 20px; font-weight: 600; color: var(--text-main); }
  .progress-info .hint { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; }

  .bar-item { margin-bottom: 14px; }
  .bar-item:last-child { margin-bottom: 0; }
  .bar-header { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--text-sub); margin-bottom: 6px; }
  .bar-track { height: 6px; background: var(--primary-soft); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .bar-track-readonly { cursor: default; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #4a9eff, #7db8ff); border-radius: 10px; transition: width 0.5s ease; }

  .bar-value-group { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; }
  .bar-value-edit {
    font-size: var(--fs-caption); color: var(--primary); border: 1px solid var(--primary);
    border-radius: 4px; padding: 0 4px; width: 50px; font-family: inherit; outline: none;
    text-align: center; background: var(--card-bg);
  }
  .bar-value-text { font-size: var(--fs-caption); color: var(--primary); font-weight: 600; }

  /* ============================================================
     CHECK-IN
     ============================================================ */
  .checkin-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.2s;
    animation: itemIn 0.25s ease both;
    min-height: 40px;
  }
  .checkin-row:last-child { border-bottom: none; }
  .checkin-row:hover { background: var(--primary-soft); border-radius: 6px; padding-left: 6px; padding-right: 6px; }

  .checkin-name { font-size: var(--fs-small); color: var(--text-sub); display: flex; align-items: center; gap: var(--sp-2); }
  .checkin-name .ci-icon { font-size: 16px; }

  .checkin-status { font-size: var(--fs-caption); padding: 3px var(--sp-3); border-radius: 20px; font-weight: 500; transition: all 0.2s; }
  .checkin-status.done { background: var(--success-soft); color: var(--success); }
  .checkin-status.pending { background: var(--warning-soft); color: var(--warning); }

  /* Heatmap */
  .heatmap-wrap { overflow-x: auto; padding-bottom: var(--sp-2); }
  .heatmap {
    display: grid;
    grid-template-rows: repeat(7, 11px);
    grid-auto-flow: column;
    grid-auto-columns: 11px;
    gap: 3px;
  }
  .hm-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--primary-soft); }
  .hm-cell.h1 { background: rgba(74,158,255,0.35); }
  .hm-cell.h2 { background: rgba(74,158,255,0.55); }
  .hm-cell.h3 { background: rgba(74,158,255,0.78); }
  .hm-cell.h4 { background: var(--primary); }
  .hm-cell.future { background: transparent; }
  .heatmap-legend {
    display: flex; align-items: center; gap: 4px; justify-content: flex-end;
    font-size: var(--fs-micro); color: var(--text-muted); margin-top: var(--sp-2);
  }
  .heatmap-legend .hm-cell { display: inline-block; }

  /* Fitness plan rows */
  .fit-plan-row {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 10px 0; border-bottom: 1px solid var(--border);
    animation: itemIn 0.25s ease both;
  }
  .fit-plan-row:last-child { border-bottom: none; }
  .fit-plan-row .fp-icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
  .fit-plan-row .fp-main { flex: 1; min-width: 0; cursor: pointer; }
  .fit-plan-row .fp-name { font-size: var(--fs-small); color: var(--text-main); }
  .fit-plan-row .fp-target { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }
  .fit-plan-row.done .fp-name { text-decoration: line-through; color: var(--text-muted); }

  .fit-log-row {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: var(--fs-small);
  }
  .fit-log-row:last-child { border-bottom: none; }
  .fit-log-row .fl-icon { font-size: 15px; flex-shrink: 0; }
  .fit-log-row .fl-main { flex: 1; min-width: 0; }
  .fit-log-row .fl-title { color: var(--text-main); }
  .fit-log-row .fl-meta { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }

  .chip-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-sub); font-size: var(--fs-caption);
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

  .fit-add-form { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: 10px; }
  .fit-add-row { display: flex; gap: var(--sp-2); }
  .fit-add-row .add-task-input { flex: 1; }
  .fit-select {
    border: 1px dashed var(--text-muted); border-radius: var(--sp-2);
    padding: 7px var(--sp-3); font-size: var(--fs-small); font-family: inherit;
    color: var(--text-main); outline: none; background: transparent; cursor: pointer;
  }
  .fit-select:focus { border-style: solid; border-color: var(--primary); }

  /* ============================================================
     INSPIRE / NEWS ITEMS
     ============================================================ */
  .inspire-item {
    padding: 10px 0; border-bottom: 1px solid var(--border);
    position: relative;
    animation: itemIn 0.25s ease both;
  }
  .inspire-item:last-child { border-bottom: none; }
  .inspire-title { font-size: var(--fs-small); color: var(--text-main); font-weight: 500; margin-bottom: 4px; }
  .inspire-desc { font-size: var(--fs-caption); color: var(--text-muted); line-height: 1.5; }

  .inspire-delete {
    position: absolute; top: 10px; right: 0;
    opacity: 0; width: 22px; height: 22px; border-radius: 5px; border: none;
    background: transparent; color: var(--danger); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .inspire-item:hover .inspire-delete { opacity: 1; }
  .inspire-delete:hover { background: var(--danger-soft); }

  /* ============================================================
     STATS
     ============================================================ */
  .stat-row { display: flex; gap: var(--sp-4); margin-top: 14px; }
  .stat-box {
    flex: 1; text-align: center; background: var(--primary-soft);
    border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-2);
    transition: background 0.2s; cursor: pointer;
  }
  .stat-box:hover { background: var(--primary-light); }
  .stat-box.readonly { cursor: default; }
  .stat-box.readonly:hover { background: var(--primary-soft); }
  .stat-num { font-size: 20px; font-weight: 700; color: var(--primary); }

  .modal-btn.danger { background: var(--danger); color: #fff; }

     ============================================================ */

// ========================================================================
// CONSTANTS
// ========================================================================
const STORAGE_KEY = 'creator-workspace-data';
const IDB_DB = 'workspace-fs';
const IDB_STORE = 'handles';
const DEVICE_KEY = 'workspace-device-id';
const TRASH_KEEP_DAYS = 30;
const BACKUP_INTERVAL = 5 * 60 * 1000;
const BACKUP_KEEP = 5;

const DEVICE_ID = (() => {
  let id = null;
  try { id = localStorage.getItem(DEVICE_KEY); } catch (e) { /* ignore */ }
  if (!id) {
    id = 'dev-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem(DEVICE_KEY, id); } catch (e) { /* ignore */ }
  }
  return id;
})();

// ========================================================================
// STORAGE LAYER (with conflict detection + rolling backups)
// ========================================================================
class StorageManager {
  constructor() {
    this.mode = 'local';       // 'fsaa' | 'local'
    this.dirHandle = null;
    this.fileHandle = null;
    this.lastSaved = null;
    this._lastRevision = -1;   // revision we last read/wrote
    this._lastBackup = 0;
  }

  get isFSAASupported() {
    return 'showDirectoryPicker' in window;
  }

  _idbPut(key, val) {
    return new Promise((resolve) => {
      const req = indexedDB.open(IDB_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => {
        const tx = req.result.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      };
      req.onerror = () => resolve(false);
    });
  }

  _idbGet(key) {
    return new Promise((resolve) => {
      const req = indexedDB.open(IDB_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => {
        const tx = req.result.transaction(IDB_STORE, 'readonly');
        const getReq = tx.objectStore(IDB_STORE).get(key);
        getReq.onsuccess = () => resolve(getReq.result || null);
        getReq.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    });
  }

  async init() {
    if (this.isFSAASupported) {
      this.dirHandle = await this._idbGet('dirHandle');
      if (this.dirHandle) {
        const perm = await this.dirHandle.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          this.mode = 'fsaa';
          this.fileHandle = await this._getFileHandle();
          return true;
        }
        try {
          const req = await this.dirHandle.requestPermission({ mode: 'readwrite' });
          if (req === 'granted') {
            this.mode = 'fsaa';
            this.fileHandle = await this._getFileHandle();
            return true;
          }
        } catch (e) { /* ignore */ }
      }
    }
    this.mode = 'local';
    return false;
  }

  async _getFileHandle() {
    try {
      return await this.dirHandle.getFileHandle('workspace.json', { create: true });
    } catch (e) {
      console.error('getFileHandle error:', e);
      return null;
    }
  }

  async connect() {
    if (!this.isFSAASupported) {
      throw new Error('当前浏览器不支持文件系统访问 API，请使用 Chrome 或 Edge 浏览器');
    }
    this.dirHandle = await window.showDirectoryPicker();
    await this._idbPut('dirHandle', this.dirHandle);
    this.fileHandle = await this._getFileHandle();
    this.mode = 'fsaa';

    const existing = await this.read();
    if (!existing) {
      await this.write(DEFAULT_DATA, { force: true });
    }
    return true;
  }

  async disconnect() {
    this.dirHandle = null;
    this.fileHandle = null;
    this.mode = 'local';
    this._lastRevision = -1;
    await this._idbPut('dirHandle', null);
  }

  async read() {
    if (this.mode === 'fsaa' && this.fileHandle) {
      try {
        const file = await this.fileHandle.getFile();
        const text = await file.text();
        if (!text.trim()) return null;
        const data = JSON.parse(text);
        this._lastRevision = (data.meta && typeof data.meta.revision === 'number') ? data.meta.revision : 0;
        return data;
      } catch (e) {
        console.error('FSAA read error:', e);
        return null;
      }
    } else {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        this._lastRevision = (data.meta && typeof data.meta.revision === 'number') ? data.meta.revision : 0;
        return data;
      } catch (e) {
        return null;
      }
    }
  }

  // Returns { ok: true } or { conflict: true, remote } or { ok: false }
  async write(data, { force = false } = {}) {
    if (!data.meta) data.meta = {};

    // Conflict check (fsaa only): did another device write since our last sync?
    if (!force && this.mode === 'fsaa' && this.fileHandle) {
      try {
        const file = await this.fileHandle.getFile();
        const text = await file.text();
        if (text.trim()) {
          const remote = JSON.parse(text);
          const remoteRev = (remote.meta && typeof remote.meta.revision === 'number') ? remote.meta.revision : 0;
          const remoteDev = remote.meta && remote.meta.deviceId;
          if (remoteRev > this._lastRevision && remoteDev && remoteDev !== DEVICE_ID) {
            return { conflict: true, remote };
          }
        }
      } catch (e) { /* read failure should not block write */ }
    }

    data.meta.revision = (typeof data.meta.revision === 'number' ? data.meta.revision : 0) + 1;
    data.meta.deviceId = DEVICE_ID;
    data.meta.savedAt = new Date().toISOString();
    data.lastSaved = data.meta.savedAt;
    this.lastSaved = data.lastSaved;

    let ok = false;
    if (this.mode === 'fsaa' && this.fileHandle) {
      try {
        const writable = await this.fileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
        ok = true;
      } catch (e) {
        console.error('FSAA write error:', e);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e2) { /* ignore */ }
        ok = false;
      }
    } else {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        ok = true;
      } catch (e) {
        console.error('localStorage write error:', e);
        ok = false;
      }
    }

    if (ok) {
      this._lastRevision = data.meta.revision;
      this._maybeBackup(data);
    }
    return { ok };
  }

  // Rolling backup: at most once per BACKUP_INTERVAL, keep BACKUP_KEEP newest
  async _maybeBackup(data) {
    if (this.mode !== 'fsaa' || !this.dirHandle) return;
    const now = Date.now();
    if (now - this._lastBackup < BACKUP_INTERVAL) return;
    this._lastBackup = now;
    try {
      const bd = await this.dirHandle.getDirectoryHandle('backups', { create: true });
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      const fh = await bd.getFileHandle('workspace-' + stamp + '.json', { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(data, null, 2));
      await w.close();
      const names = [];
      for await (const n of bd.keys()) {
        if (n.startsWith('workspace-') && n.endsWith('.json')) names.push(n);
      }
      names.sort();
      while (names.length > BACKUP_KEEP) {
        await bd.removeEntry(names.shift());
      }
    } catch (e) {
      console.warn('backup failed:', e);
    }
  }

  async requestPermission() {
    if (this.dirHandle) {
      const perm = await this.dirHandle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        this.mode = 'fsaa';
        this.fileHandle = await this._getFileHandle();
        return true;
      }
    }
    return false;
  }
}

// ========================================================================
// UTILITIES

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function weekNum(d = new Date()) {
  const onejan = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
}

function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

// ========================================================================
// TOAST (with optional action button)
// ========================================================================
function showToast(msg, type = '', opts = {}) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  const span = document.createElement('span');
  span.textContent = msg;
  toast.appendChild(span);

  let dismissed = false;
  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    toast.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }

  if (opts.actionLabel && typeof opts.onAction === 'function') {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = opts.actionLabel;
    btn.addEventListener('click', () => {
      opts.onAction();
      dismiss();
    });
    toast.appendChild(btn);
  }

  container.appendChild(toast);
  const ttl = opts.duration || (opts.actionLabel ? 5000 : 2200);
  setTimeout(dismiss, ttl);
  return { dismiss };
}

// ========================================================================
// MODAL
// ========================================================================
function showModal(html) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = html;
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ========================================================================
// SAVE (with 3-state indicator + conflict handling)
// ========================================================================
const scheduleSave = debounce(() => { flushSave(); }, 800);

function save() {
  setSaveState('saving');
  scheduleSave();
}

async function flushSave() {
  if (!DATA) return;
  setSaveState('saving');
  const result = await storage.write(DATA);
  if (result && result.conflict) {
    handleConflict(result.remote);
    return;
  }
  setSaveState(result && result.ok ? 'saved' : 'error');
}

function setSaveState(state) {
  saveState = state;
  updateSyncIndicator();
}

function updateSyncIndicator() {
  const el = document.getElementById('syncIndicator');
  const text = document.getElementById('syncText');
  if (!el || !text) return;

  if (saveState === 'error') {
    el.className = 'sync-indicator error';
    text.textContent = '保存失败 · 点击重试';
    return;
  }
  if (saveState === 'saving') {
    el.className = 'sync-indicator saving';
    text.textContent = '保存中…';
    return;
  }
  if (storage.mode === 'fsaa') {
    el.className = 'sync-indicator connected';
    const time = storage.lastSaved ? new Date(storage.lastSaved).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
    text.textContent = '已同步' + (time ? ' · ' + time : '');
  } else {
    el.className = 'sync-indicator local';
    text.textContent = '本地存储（点击数据管理连接 iCloud）';
  }
}

document.getElementById('syncIndicator').addEventListener('click', () => {
  if (saveState === 'error') flushSave();
});

// --- Conflict resolution ---
function handleConflict(remote) {
  if (conflictOpen) return;
  conflictOpen = true;
  const remoteTime = remote.meta && remote.meta.savedAt
    ? new Date(remote.meta.savedAt).toLocaleString('zh-CN')
    : '未知时间';
  showModal(
    '<div class="modal-title">⚠️ 检测到同步冲突</div>' +
    '<p style="font-size:14px;color:var(--text-sub);line-height:1.7;">' +
    '数据已在另一台设备上更新（' + escapeHTML(remoteTime) + '）。<br>' +
    '继续保存将覆盖对方的修改。请选择处理方式：' +
    '</p>' +
    '<div class="modal-actions" style="flex-direction:column;align-items:stretch;">' +
    '<button class="modal-btn confirm" id="conflictLoadRemote">加载远端数据（推荐）</button>' +
    '<button class="modal-btn outline" id="conflictExportLocal">导出本地副本后加载远端</button>' +
    '<button class="modal-btn danger" id="conflictKeepLocal">保留本地，覆盖远端</button>' +
    '</div>'
  );
  document.getElementById('conflictLoadRemote').addEventListener('click', () => {
    closeModal(); conflictOpen = false;
    DATA = mergeDefaults(remote, DEFAULT_DATA);
    storage._lastRevision = (remote.meta && remote.meta.revision) || 0;
    renderPage(currentPage);
    setSaveState('saved');
    showToast('已加载远端最新数据', 'success');
  });
  document.getElementById('conflictExportLocal').addEventListener('click', () => {
    closeModal(); conflictOpen = false;
    exportData('workspace-local-backup');
    DATA = mergeDefaults(remote, DEFAULT_DATA);
    storage._lastRevision = (remote.meta && remote.meta.revision) || 0;
    renderPage(currentPage);
    setSaveState('saved');
    showToast('本地副本已导出，远端数据已加载', 'success');
  });
  document.getElementById('conflictKeepLocal').addEventListener('click', async () => {
    closeModal(); conflictOpen = false;
    const r = await storage.write(DATA, { force: true });
    setSaveState(r.ok ? 'saved' : 'error');
    showToast(r.ok ? '已用本地数据覆盖远端' : '覆盖失败', r.ok ? 'warning' : 'error');
  });
}

// ========================================================================
// THEME MANAGER
// ========================================================================
const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');

function currentThemePref() {
  return (DATA && DATA.settings && DATA.settings.theme) || 'system';
}

function applyTheme() {
  const pref = currentThemePref();
  const resolved = pref === 'system' ? (themeMedia.matches ? 'dark' : 'light') : pref;
  document.documentElement.dataset.theme = resolved;
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (icon && label) {
    if (pref === 'light') { icon.textContent = '🌞'; label.textContent = '浅色模式'; }
    else if (pref === 'dark') { icon.textContent = '🌙'; label.textContent = '深色模式'; }
    else { icon.textContent = '🖥️'; label.textContent = '跟随系统'; }
  }
}

function cycleTheme() {
  const order = ['light', 'dark', 'system'];
  const cur = currentThemePref();
  const next = order[(order.indexOf(cur) + 1) % order.length];
  DATA.settings.theme = next;
  applyTheme();
  save();
  renderPage(currentPage);
  showToast(next === 'light' ? '已切换到浅色模式' : next === 'dark' ? '已切换到深色模式' : '已跟随系统主题', 'success');
}

function setTheme(pref) {
  DATA.settings.theme = pref;
  applyTheme();
  save();
  renderPage(currentPage);
}

themeMedia.addEventListener('change', () => {
  if (currentThemePref() === 'system') applyTheme();
});

document.getElementById('themeToggle').addEventListener('click', cycleTheme);

// ========================================================================
// DATA PATH HELPERS
// ========================================================================
function getNestedData(path) {
  const parts = path.split('.');
  let obj = DATA;
  for (const p of parts) { if (obj == null) return undefined; obj = obj[p]; }
  return obj;
}

function setNestedData(path, value) {
  const parts = path.split('.');
  let obj = DATA;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = value;
}

function mergeDefaults(data, defaults) {
  for (const key in defaults) {
    if (!(key in data)) {
      data[key] = JSON.parse(JSON.stringify(defaults[key]));
    } else if (typeof defaults[key] === 'object' && !Array.isArray(defaults[key]) && defaults[key] !== null) {
      mergeDefaults(data[key], defaults[key]);
    }
  }
  return data;
}

// ========================================================================
// CALC HELPERS
// ========================================================================
function calcTaskPercent(tasks) {
  if (!tasks || tasks.length === 0) return 0;
  return Math.round(tasks.filter(t => t.done).length / tasks.length * 100);
}

function calcAllTasksPercent() {
  const dp = DATA.tasks.dailyPlan;
  const all = [
    ...DATA.tasks.dashboard, ...dp.morning, ...dp.afternoon, ...dp.evening,
    ...DATA.tasks.aiLearn, ...DATA.tasks.english,
    ...DATA.tasks.comicStoryboard, ...DATA.tasks.researchPapers
  ];
  return calcTaskPercent(all);
}

function countAllTasks() {
  const dp = DATA.tasks.dailyPlan;
  const all = [
    ...DATA.tasks.dashboard, ...dp.morning, ...dp.afternoon, ...dp.evening,
    ...DATA.tasks.aiLearn, ...DATA.tasks.english,
    ...DATA.tasks.comicStoryboard, ...DATA.tasks.researchPapers
  ];
  return { done: all.filter(t => t.done).length, total: all.length };
}

function todayCN() {
  const d = new Date();
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + '日一二三四五六'[d.getDay()];
}

// ========================================================================
// CHECK-IN HISTORY + STREAK (module linkage: auto-computed)
// ========================================================================
function recordCheckinToday() {
  DATA.checkinHistory[todayKey()] = DATA.checkins.daily.filter(c => c.done).length;
}

function checkinThreshold() {
  return Math.max(1, Math.ceil((DATA.checkins.daily.length || 5) * 0.6));
}

function calcStreak() {
  const th = checkinThreshold();
  const qualifies = (key) => (DATA.checkinHistory[key] || 0) >= th;
  let streak = 0;
  const d = new Date();
  if (!qualifies(todayKey(d))) d.setDate(d.getDate() - 1); // today still in progress
  while (qualifies(todayKey(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
    if (streak > 370) break;
  }
  return streak;
}

// ========================================================================
// FITNESS HELPERS (types / plan / logs)
// ========================================================================
function fitnessType(typeId) {
  return (DATA.fitness.types || []).find(t => t.id === typeId) || { id: typeId, icon: '🏅', name: '其他', unit: '' };
}

function weekStartKey(d = new Date()) {
  const day = d.getDay(); // 0=Sun
  const diff = day === 0 ? 6 : day - 1; // Monday as week start
  const m = new Date(d);
  m.setDate(d.getDate() - diff);
  return todayKey(m);
}

function weekLogs() {
  const start = weekStartKey();
  return (DATA.fitness.logs || []).filter(l => l.date >= start);
}

function weekStats() {
  const logs = weekLogs();
  return {
    sessions: logs.length,
    duration: logs.reduce((s, l) => s + (parseInt(l.duration) || 0), 0),
    calories: logs.reduce((s, l) => s + (parseInt(l.calories) || 0), 0)
  };
}

// Fitness streak: consecutive days with >= 1 workout log
function calcFitnessStreak() {
  const dates = new Set((DATA.fitness.logs || []).map(l => l.date));
  let streak = 0;
  const d = new Date();
  if (!dates.has(todayKey(d))) d.setDate(d.getDate() - 1);
  while (dates.has(todayKey(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
    if (streak > 370) break;
  }
  return streak;
}

// Migrate legacy checkins.fitness -> fitness.plan (one-time)
function migrateFitnessData() {
  if (DATA.checkins && Array.isArray(DATA.checkins.fitness)) {
    const iconMap = { '🏃': 'ft-run', '🏋️': 'ft-strength', '🧘': 'ft-yoga', '🚴': 'ft-cycle', '🏊': 'ft-swim', '🪜': 'ft-stairs' };
    if (!DATA.fitness) DATA.fitness = JSON.parse(JSON.stringify(DEFAULT_DATA.fitness));
    DATA.fitness.plan = DATA.checkins.fitness.map(c => {
      const parts = (c.name || '').split(' ');
      return {
        id: c.id || uid(),
        day: parts[0] || '',
        typeId: iconMap[c.icon] || 'ft-run',
        target: parts.slice(1).join(' '),
        done: !!c.done
      };
    });
    delete DATA.checkins.fitness;
  }
  if (DATA.stats && DATA.stats.fitness && ('running' in DATA.stats.fitness || 'strength' in DATA.stats.fitness)) {
    DATA.stats.fitness = { goal: DATA.stats.fitness.goal || 7 };
  }
}

// ========================================================================
// WEEKLY TREND
// ========================================================================
function recordWeeklyTrend() {
  if (!Array.isArray(DATA.weeklyTrend)) DATA.weeklyTrend = [];
  const wk = weekNum();
  const rate = calcAllTasksPercent();
  const existing = DATA.weeklyTrend.find(w => w.week === wk);
  if (existing) existing.rate = rate;
  else DATA.weeklyTrend.push({ week: wk, rate });
  DATA.weeklyTrend = DATA.weeklyTrend.slice(-8);
}

function trendChartHTML() {
  const data = (DATA.weeklyTrend || []).slice(-8);
  if (data.length < 2) {
    return emptyStateHTML('📈', '趋势数据积累中', '持续使用几天后，这里会显示近 8 周完成率走势');
  }
  const W = 300, H = 80, pad = 14;
  const stepX = (W - pad * 2) / (data.length - 1);
  const pts = data.map((d, i) => [
    Math.round(pad + i * stepX),
    Math.round(H - pad - (d.rate / 100) * (H - pad * 2 - 8))
  ]);
  const line = pts.map(p => p.join(',')).join(' ');
  const area = pad + ',' + (H - pad) + ' ' + line + ' ' + (W - pad) + ',' + (H - pad);
  let dots = '', labels = '';
  pts.forEach((p, i) => {
    dots += '<circle class="trend-dot" cx="' + p[0] + '" cy="' + p[1] + '" r="3"/>';
    labels += '<text class="trend-label" x="' + p[0] + '" y="' + (H - 2) + '" text-anchor="middle">W' + data[i].week + '</text>';
  });
  return '<svg class="trend-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="近8周完成率趋势">' +
    '<polygon class="trend-area" points="' + area + '"/>' +
    '<polyline class="trend-line" points="' + line + '"/>' + dots + labels + '</svg>';
}

// ========================================================================
// TRASH (soft delete + undo + 30-day purge)
// ========================================================================
function purgeTrash() {
  const cutoff = Date.now() - TRASH_KEEP_DAYS * 86400000;
  const before = DATA.trash.length;
  DATA.trash = DATA.trash.filter(t => new Date(t.deletedAt).getTime() > cutoff);
  return before - DATA.trash.length;
}

function softDelete(path, id) {
  const arr = getNestedData(path);
  if (!Array.isArray(arr)) return;
  const idx = arr.findIndex(x => x.id === id);
  if (idx === -1) return;
  const item = arr[idx];
  arr.splice(idx, 1);
  const entry = { tid: uid(), path: path, item: item, deletedAt: new Date().toISOString() };
  DATA.trash.unshift(entry);
  save();
  rerender();
  showToast('已删除', '', {
    actionLabel: '撤销',
    onAction: () => restoreTrashEntry(entry.tid, idx)
  });
}

function restoreTrashEntry(tid, origIdx) {
  const ti = DATA.trash.findIndex(t => t.tid === tid);
  if (ti === -1) return;
  const entry = DATA.trash[ti];
  DATA.trash.splice(ti, 1);
  const target = getNestedData(entry.path);
  if (Array.isArray(target)) {
    const at = typeof origIdx === 'number' ? Math.min(origIdx, target.length) : target.length;
    target.splice(at, 0, entry.item);
  }
  save();
  rerender();
  showToast('已恢复', 'success');
}

function clearDoneTasks(paths) {
  const entries = [];
  let cleared = 0;
  for (const path of paths) {
    const arr = getNestedData(path);
    if (!Array.isArray(arr)) continue;
    for (let i = arr.length - 1; i >= 0; i--) {
      if (arr[i].done) {
        entries.unshift({ tid: uid(), path: path, item: arr[i], deletedAt: new Date().toISOString() });
        arr.splice(i, 1);
        cleared++;
      }
    }
  }
  if (cleared === 0) return;
  DATA.trash = entries.concat(DATA.trash);
  save();
  rerender();
  showToast('已清除 ' + cleared + ' 项已完成任务', 'success', {
    actionLabel: '撤销',
    onAction: () => {
      for (const e of entries) {
        const ti = DATA.trash.findIndex(t => t.tid === e.tid);
        if (ti !== -1) {
          DATA.trash.splice(ti, 1);
          const target = getNestedData(e.path);
          if (Array.isArray(target)) target.push(e.item);
        }
      }
      save();
      rerender();
      showToast('已恢复', 'success');
    }
  });
}

function trashItemLabel(item) {

  return '(未命名)';
}

  }
  html += '<div class="inspire-add-form">' +
    '<input class="add-task-input" data-cat="' + path + '" data-field="title" placeholder="标题" aria-label="标题">' +

  '</div>';
  return html;
}

// Read-only list with modal-based add (topContent / published / resources)
function simpleListHTML(path, items, emptyEmoji, emptyText) {
  if (!items || items.length === 0) {
    return emptyStateHTML(emptyEmoji || '📭', emptyText || '暂无内容', '点击右上角 + 添加');
  }
  return items.map(i =>
    '<div class="inspire-item">' +
      '<div class="inspire-title">' + (i.rank ? escapeHTML(i.rank + ' ') : '') + escapeHTML(i.title) + '</div>' +
      '<div class="inspire-desc">' + escapeHTML(i.desc) + '</div>' +
      '<button class="inspire-delete" data-path="' + path + '" data-id="' + i.id + '" title="删除" aria-label="删除">✕</button>' +
    '</div>'
  ).join('');
}

function statBox(path, value, label, readonly) {
  if (readonly) {
    return '<div class="stat-box readonly"><div class="stat-num">' + escapeHTML(String(value)) + '</div><div class="stat-label">' + escapeHTML(label) + '</div></div>';
  }
  return '<div class="stat-box"><div class="stat-num" data-stat="' + path + '" title="点击编辑">' + escapeHTML(String(value)) + '</div><div class="stat-label">' + escapeHTML(label) + '</div></div>';
}

const PAGE_ORDER = ['dashboard', 'daily-plan', 'fitness', 'inspiration', 'review', 'comic', 'ai-learn', 'english', 'research', 'news', 'settings'];

function renderPage(pageId) {
  const page = PAGES[pageId];
  if (!page) return;
  currentPage = pageId;

  document.querySelectorAll('.menu-item').forEach(m => {
    m.classList.toggle('active', m.dataset.page === pageId);
  });

  const main = document.getElementById('mainContent');
  main.innerHTML =
    '<div class="page-enter">' +
      '<div class="main-header">' +
        '<div><h1>' + page.title + '</h1><div class="date">' + todayCN() + ' · 第' + weekNum() + '周</div></div>' +
        '<div class="header-actions">' +
          '<button class="btn btn-outline btn-sm" data-action="open-palette" title="Cmd/Ctrl+K">🔍 搜索</button>' +
        '</div>' +
      '</div>' +
      page.render() +
      '<div class="bottom-spacer"></div>' +
    '</div>';
  main.scrollTop = 0;

  // Close mobile drawer after navigation
  closeDrawer();
}

function rerender() {
  const main = document.getElementById('mainContent');
  const scrollTop = main.scrollTop;
  const page = PAGES[currentPage];
  if (!page) return;
  const enter = main.querySelector('.page-enter');
  if (enter) {
    enter.classList.remove('page-enter'); // avoid replaying animation on data updates
    enter.innerHTML =
      '<div class="main-header">' +
        '<div><h1>' + page.title + '</h1><div class="date">' + todayCN() + ' · 第' + weekNum() + '周</div></div>' +
        '<div class="header-actions">' +
          '<button class="btn btn-outline btn-sm" data-action="open-palette" title="Cmd/Ctrl+K">🔍 搜索</button>' +
        '</div>' +
      '</div>' +
      page.render() +
      '<div class="bottom-spacer"></div>';
    main.scrollTop = scrollTop;
  } else {
    renderPage(currentPage);
    main.scrollTop = scrollTop;
  }
}

document.querySelectorAll('.menu-item').forEach(m => {

function addTask(path, text) {
  const arr = getNestedData(path);
  if (!Array.isArray(arr)) return;
  arr.push({ id: uid(), text: text, done: false });
  save();
  rerender();
  showToast('已添加', 'success');
}

function toggleTask(path, id) {
  const arr = getNestedData(path);
  if (!Array.isArray(arr)) return;
  const t = arr.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  recordWeeklyTrend();
  save();
  rerender();
}

function addInspire(path, title, desc) {
  const arr = getNestedData(path);
  if (!Array.isArray(arr)) return;
  arr.push({ id: uid(), title: title, desc: desc || '' });
  save();
  rerender();
}

function toggleCheckin(cat, id) {
  const arr = DATA.checkins[cat];
  if (!Array.isArray(arr)) return;
  const c = arr.find(x => x.id === id);
  if (!c) return;
  c.done = !c.done;
  if (cat === 'daily') recordCheckinToday();
  save();
  rerender();
}

// Rollover unfinished daily-plan tasks ("结转未完成到明天")
function rolloverPlan() {
  const dp = DATA.tasks.dailyPlan;
  let moved = 0;
  for (const key of ['morning', 'afternoon', 'evening']) {
    const remaining = dp[key].filter(t => !t.done);
    const doneItems = dp[key].filter(t => t.done);
    for (const item of doneItems) {
      DATA.trash.unshift({ tid: uid(), path: 'tasks.dailyPlan.' + key, item: item, deletedAt: new Date().toISOString() });
      moved++;
    }
    dp[key] = remaining.map(t => ({ id: uid(), text: t.text, done: false }));
  }
  save();
  rerender();
  showToast(moved > 0 ? '已归档 ' + moved + ' 项已完成任务，未完成任务已结转' : '未完成任务已结转到明天', 'success');
}

// Auto-generate weekly review draft from live data (P3)
function genWeeklyDraft() {
  const all = countAllTasks();
  const pct = calcAllTasksPercent();
  const streak = calcStreak();
  const checkinsDone = DATA.checkins.daily.filter(c => c.done).length;
  const ideas = DATA.inspirations.ideas.length;

  DATA.weeklyReview.week = weekNum();
  DATA.weeklyReview.good = '本周完成任务 ' + all.done + '/' + all.total + '（' + pct + '%），连续打卡 ' + streak + ' 天';
  const weak = [];
  if (calcTaskPercent(DATA.tasks.english) < 50) weak.push('英语学习');
  if (calcTaskPercent(DATA.tasks.researchPapers) < 50) weak.push('科研文献');
  if (calcTaskPercent(DATA.tasks.aiLearn) < 50) weak.push('AI 学习');
  DATA.weeklyReview.improve = weak.length ? weak.join('、') + ' 完成率偏低，下周需增加投入' : '各领域进度均衡，继续保持';
  DATA.weeklyReview.focus = '灵感库已积累 ' + ideas + ' 条选题，优先转化 2-3 条为正式内容';
  save();
  rerender();
  showToast('已根据当前数据生成本周小结', 'success');
}

function openWorkoutModal(planItem) {
  const types = DATA.fitness.types || [];
  let selectedType = planItem ? planItem.typeId : (types[0] && types[0].id);

  const chips = types.map(t =>
    '<button class="chip' + (t.id === selectedType ? ' selected' : '') + '" data-chip="' + t.id + '">' + t.icon + ' ' + escapeHTML(t.name) + '</button>'
  ).join('');

  const title = planItem
    ? '完成打卡 · ' + planItem.day + ' ' + fitnessType(planItem.typeId).name
    : '记录一次训练';

  showModal(
    '<div class="modal-title">' + escapeHTML(title) + '</div>' +
    '<div class="modal-field"><label>健身类型</label><div class="chip-picker" id="chipPicker">' + chips + '</div></div>' +
    '<div class="modal-field"><label>时长（分钟）</label><input id="wlDuration" type="number" min="0" placeholder="如 30"></div>' +
    '<div class="modal-field"><label>消耗（千卡）</label><input id="wlCalories" type="number" min="0" placeholder="如 250"></div>' +
    '<div class="modal-field"><label>备注（可选）</label><input id="wlNote" placeholder="如 晨跑 3km"></div>' +
    '<div class="modal-actions">' +
      '<button class="modal-btn cancel" id="modalCancel">取消</button>' +
      (planItem ? '<button class="modal-btn outline" id="wlSkip">不记数据，直接打卡</button>' : '') +
      '<button class="modal-btn confirm" id="modalOk">' + (planItem ? '记录并完成' : '保存记录') + '</button>' +
    '</div>'
  );

  document.getElementById('chipPicker').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    selectedType = chip.dataset.chip;
    document.querySelectorAll('#chipPicker .chip').forEach(c =>
      c.classList.toggle('selected', c.dataset.chip === selectedType));
  });

  document.getElementById('modalCancel').addEventListener('click', closeModal);

  const doLog = (withData) => {
    if (withData) {
      const dur = parseInt(document.getElementById('wlDuration').value) || 0;
      const cal = parseInt(document.getElementById('wlCalories').value) || 0;
      const note = document.getElementById('wlNote').value.trim();
      DATA.fitness.logs.push({
        id: uid(), date: todayKey(), typeId: selectedType,
        duration: dur, calories: cal, note: note
      });
    }
    if (planItem) planItem.done = true;
    closeModal();
    save();
    rerender();
    showToast(planItem ? '打卡完成，数据已记录 💪' : '训练记录已保存', 'success');
  };

  document.getElementById('modalOk').addEventListener('click', () => doLog(true));
  const skipBtn = document.getElementById('wlSkip');
  if (skipBtn) skipBtn.addEventListener('click', () => doLog(false));

  const durInput = document.getElementById('wlDuration');
  if (durInput) durInput.focus();
}

function exportData(prefix) {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (prefix || 'workspace') + '-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  showToast('已导出数据文件', 'success');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.version) throw new Error('bad format');
      DATA = mergeDefaults(data, DEFAULT_DATA);
      recordCheckinToday();
      applyTheme();
      save();
      renderPage(currentPage);
      showToast('数据导入成功', 'success');
    } catch (err) {
      showToast('导入失败：文件格式错误', 'error');
    }
  });
  input.click();
}

function resetData() {
  showConfirm('重置数据', '将恢复为初始示例数据。当前数据会先自动导出一份备份到下载目录。', '重置', () => {
    exportData('workspace-before-reset');
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    DATA.settings.onboarded = true;
    applyTheme();
    save();
    renderPage(currentPage);
    showToast('已重置为示例数据', 'success');
  });
}

function buildPaletteIndex() {
  const items = [];
  // Pages
  for (const pid of PAGE_ORDER) {
    const p = PAGES[pid];
    if (p) items.push({ type: 'page', icon: '📄', text: p.title, meta: '页面', run: () => renderPage(pid) });
  }
  // Tasks
  const taskGroups = [
    ['tasks.dashboard', '工作台'],
    ['tasks.dailyPlan.morning', '上午计划'],
    ['tasks.dailyPlan.afternoon', '下午计划'],
    ['tasks.dailyPlan.evening', '晚上计划'],
    ['tasks.aiLearn', 'AI学习'],
    ['tasks.english', '英语'],
    ['tasks.comicStoryboard', '漫剧分镜'],
    ['tasks.researchPapers', '科研文献']
  ];
  for (const [path, label] of taskGroups) {
    const arr = getNestedData(path) || [];
    for (const t of arr) {
      items.push({
        type: 'task', icon: t.done ? '✅' : '⬜', text: t.text, meta: label,
        run: () => { toggleTask(path, t.id); }
      });
    }
  }
  // Inspirations + news
  const inspGroups = [
    ['inspirations.ideas', '灵感'], ['inspirations.trends', '趋势'], ['inspirations.sources', '来源'],
    ['news.tech', '科技'], ['news.creation', '创作'], ['news.hotlist', '热榜']
  ];
  for (const [path, label] of inspGroups) {
    const arr = getNestedData(path) || [];
    for (const i of arr) {
      items.push({
        type: 'inspire', icon: '💡', text: i.title, meta: label,
        run: () => renderPage(path.startsWith('news') ? 'news' : 'inspiration')
      });
    }
  }
  return items;
}

  } else {
    const all = buildPaletteIndex();
    paletteItems = q
      ? all.filter(i => i.text.toLowerCase().includes(q.toLowerCase())).slice(0, 30)
      : all.filter(i => i.type === 'page').concat(all.filter(i => i.type !== 'page').slice(0, 12));
  }
  paletteIndex = 0;

  if (!paletteItems.length) {
    list.innerHTML = '<div class="palette-empty">没有匹配的结果</div>';
    return;
  }

  let lastMeta = null;
  list.innerHTML = paletteItems.map((item, idx) => {
    let groupLabel = '';
    if (item.meta !== lastMeta) {
      groupLabel = '<div class="palette-group-label">' + escapeHTML(item.meta) + '</div>';
      lastMeta = item.meta;
    }
    return groupLabel +
      '<div class="palette-item' + (idx === paletteIndex ? ' selected' : '') + '" data-idx="' + idx + '">' +
        '<span class="pi-icon">' + item.icon + '</span>' +
        '<span>' + escapeHTML(item.text) + '</span>' +
        '<span class="pi-meta">' + escapeHTML(item.meta) + '</span>' +
      '</div>';
  }).join('');
}

function runPaletteItem(idx) {
  const item = paletteItems[idx];
  if (!item) return;
  closePalette();
  item.run();
}

document.getElementById('paletteInput').addEventListener('input', (e) => renderPaletteList(e.target.value));
document.getElementById('paletteInput').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = Math.min(paletteIndex + 1, paletteItems.length - 1); renderPaletteList(document.getElementById('paletteInput').value); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = Math.max(paletteIndex - 1, 0); renderPaletteList(document.getElementById('paletteInput').value); }
  else if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(paletteIndex); }
  else if (e.key === 'Escape') { closePalette(); }
});
document.getElementById('paletteList').addEventListener('click', (e) => {
  const item = e.target.closest('.palette-item');
  if (item) runPaletteItem(parseInt(item.dataset.idx, 10));
});
document.getElementById('paletteOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'paletteOverlay') closePalette();
});

// KEYBOARD SHORTCUTS
// ========================================================================
function showShortcutsHelp() {
  showModal(
    '<div class="modal-title">⌨️ 快捷键</div>' +
    '<div style="font-size:13px;color:var(--text-sub);line-height:2;">' +
    '<div><code class="inline-code">Cmd/Ctrl + K</code> 全局搜索 / 命令面板</div>' +
    '<div><code class="inline-code">N</code> 聚焦当前页新建任务输入框</div>' +
    '<div><code class="inline-code">1 ~ 9</code> 快速切换页面</div>' +
    '<div><code class="inline-code">Enter</code> 在输入框中快速添加</div>' +
    '<div><code class="inline-code">Esc</code> 关闭弹窗 / 面板</div>' +
    '<div><code class="inline-code">?</code> 显示本帮助</div>' +
    '</div>' +
    '<div class="modal-actions"><button class="modal-btn confirm" id="modalOk">知道了</button></div>'
  );
  document.getElementById('modalOk').addEventListener('click', closeModal);
}

document.getElementById('kbdHelpBtn').addEventListener('click', showShortcutsHelp);

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;

  // Cmd/Ctrl+K — palette
  if (mod && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const overlay = document.getElementById('paletteOverlay');
    if (overlay.classList.contains('show')) closePalette(); else openPalette();
    return;
  }

  // Esc — close topmost layer
  if (e.key === 'Escape') {
    if (document.getElementById('paletteOverlay').classList.contains('show')) { closePalette(); return; }
    if (document.getElementById('modalOverlay').classList.contains('show')) { closeModal(); return; }
    closeDrawer();
    return;
  }

  // Below: skip when typing or modifier held
  if (mod || e.altKey || isTypingTarget(e.target)) return;

  // ? — help
  if (e.key === '?') { e.preventDefault(); showShortcutsHelp(); return; }

  // N — focus new-task input on current page
  if (e.key.toLowerCase() === 'n') {
    const input = document.querySelector('#mainContent .add-task-input');
    if (input) { e.preventDefault(); input.focus(); }
    return;
  }

  // 1-9 — switch pages
  if (/^[1-9]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    if (idx < PAGE_ORDER.length) renderPage(PAGE_ORDER[idx]);
    return;
  }
});

  },
  {

  },

    desc: '按 <code class="inline-code">Cmd/Ctrl + K</code> 随时唤起全局搜索，输入 <code class="inline-code">&gt;</code> 执行命令。<br>按 <code class="inline-code">N</code> 快速新建任务，按 <code class="inline-code">1-9</code> 切换页面。<br>完成比例会根据任务勾选<strong>自动计算</strong>，无需手动调整。'
  }
];
let onboardStep = 0;

function startOnboarding(force) {
  if (!force && DATA.settings.onboarded) return;
  onboardStep = 0;
  renderOnboardStep();
  document.getElementById('onboardOverlay').classList.add('show');
}

function renderOnboardStep() {
  const s = ONBOARD_STEPS[onboardStep];
  const isLast = onboardStep === ONBOARD_STEPS.length - 1;
  document.getElementById('onboardContent').innerHTML =
    '<div class="ob-emoji">' + s.emoji + '</div>' +
    '<div class="ob-title">' + s.title + '</div>' +
    '<div class="ob-desc">' + s.desc + '</div>' +
    '<div class="ob-dots">' + ONBOARD_STEPS.map((_, i) =>
      '<div class="ob-dot' + (i === onboardStep ? ' active' : '') + '"></div>').join('') + '</div>' +
    '<div class="ob-actions">' +
      (onboardStep > 0 ? '<button class="modal-btn cancel" id="obPrev">上一步</button>' : '') +
      '<button class="modal-btn outline" id="obSkip">跳过</button>' +
      '<button class="modal-btn confirm" id="obNext">' + (isLast ? '开始使用' : '下一步') + '</button>' +
    '</div>';

  document.getElementById('obNext').addEventListener('click', () => {
    if (isLast) finishOnboarding();
    else { onboardStep++; renderOnboardStep(); }
  });
  document.getElementById('obSkip').addEventListener('click', finishOnboarding);
  const prev = document.getElementById('obPrev');
  if (prev) prev.addEventListener('click', () => { onboardStep--; renderOnboardStep(); });
}

function finishOnboarding() {
  document.getElementById('onboardOverlay').classList.remove('show');
  if (!DATA.settings.onboarded) {
    DATA.settings.onboarded = true;
    save();
  }
  if (storage.mode === 'local' && storage.isFSAASupported) {
    setTimeout(() => showToast('提示：到「数据管理」连接 data 文件夹可启用 iCloud 同步', 'warning', { duration: 4000 }), 600);
  }
}

// ========================================================================
// GLOBAL CLICK DELEGATION
// ========================================================================
document.addEventListener('click', (e) => {
  const t = e.target;

  // --- Task checkbox toggle ---
  const checkbox = t.closest('.task-checkbox');
  if (checkbox && checkbox.dataset.path) {
    toggleTask(checkbox.dataset.path, checkbox.dataset.id);
    return;
  }

  // --- Task delete (soft) ---
  const taskDel = t.closest('.task-delete');
  if (taskDel && taskDel.dataset.path) {
    softDelete(taskDel.dataset.path, taskDel.dataset.id);
    return;
  }

  // --- Inspire/news delete (soft) ---
  const inspDel = t.closest('.inspire-delete');
  if (inspDel) {
    if (inspDel.dataset.msDel) {
      softDelete('learning.research.milestones', inspDel.dataset.msDel);
      return;
    }
    if (inspDel.dataset.path && inspDel.dataset.id) {
      softDelete(inspDel.dataset.path, inspDel.dataset.id);
      return;
    }
  }

  // --- Add task button ---
  if (t.classList.contains('add-btn') && t.dataset.path) {
    const path = t.dataset.path;
    const input = document.querySelector('.add-task-input[data-path="' + path + '"]');
    if (input && input.value.trim()) {
      addTask(path, input.value.trim());
      setTimeout(() => {
        const ni = document.querySelector('.add-task-input[data-path="' + path + '"]');
        if (ni) ni.focus();
      }, 50);
    } else if (input) {
      input.classList.add('input-error');
      setTimeout(() => input.classList.remove('input-error'), 500);
    }
    return;
  }

  // --- Add inspire button ---
  if (t.classList.contains('add-btn') && t.dataset.cat) {
    const cat = t.dataset.cat;
    const form = t.closest('.inspire-add-form');
    const titleInput = form ? form.querySelector('[data-field="title"]') : null;
    const descInput = form ? form.querySelector('[data-field="desc"]') : null;
    if (titleInput && titleInput.value.trim()) {
      addInspire(cat, titleInput.value.trim(), descInput ? descInput.value.trim() : '');
      showToast('已添加', 'success');
      setTimeout(() => {
        const ni = document.querySelector('.inspire-add-form [data-cat="' + cat + '"][data-field="title"]');
        if (ni) ni.focus();
      }, 50);
    } else if (titleInput) {
      titleInput.classList.add('input-error');
      setTimeout(() => titleInput.classList.remove('input-error'), 500);
    }
    return;
  }

  // --- Checkin toggle ---
  const checkinRow = t.closest('.checkin-row[data-cat]');
  if (checkinRow && checkinRow.dataset.cat && checkinRow.dataset.id) {
    toggleCheckin(checkinRow.dataset.cat, checkinRow.dataset.id);
    return;
  }

  // --- Milestone cycle ---
  const msRow = t.closest('.checkin-row[data-ms]');
  if (msRow) {
    const ms = DATA.learning.research.milestones.find(m => m.id === msRow.dataset.ms);
    if (ms) {
      ms.status = MS_CYCLE[ms.status] || 'pending';
      save();
      rerender();
    }
    return;
  }

  // --- Fitness plan row: open workout log modal (or undo) ---
  const planRow = t.closest('.fit-plan-row[data-plan-toggle]');
  if (planRow) {
    const item = (DATA.fitness.plan || []).find(p => p.id === planRow.dataset.planToggle);
    if (item) {
      if (item.done) {
        item.done = false;
        save();
        rerender();
      } else {
        openWorkoutModal(item);
      }
    }
    return;
  }

  // --- Clear done per-list ---
  const clearBtn = t.closest('.clear-done-btn[data-clear-path]');
  if (clearBtn) {
    clearDoneTasks([clearBtn.dataset.clearPath]);
    return;
  }

  // --- Bar track click (+10, manual bars only) ---
  const track = t.closest('.bar-track[data-cat]');
  if (track && track.dataset.cat === 'review.interaction') {
    DATA.review.interactionRate = Math.min(100, DATA.review.interactionRate + 10);
    save();
    rerender();
    return;
  }

  // --- Stat box edit (click) ---
  const statNum = t.closest('.stat-num[data-stat]');
  if (statNum && !statNum.querySelector('input')) {
    const path = statNum.dataset.stat;
    const oldVal = statNum.textContent;
    const input = document.createElement('input');
    input.className = 'stat-num-edit';
    input.value = oldVal;
    statNum.textContent = '';
    statNum.appendChild(input);
    input.focus();
    input.select();
    const commit = () => {
      const v = input.value.trim();
      if (v) { setNestedData(path, v); save(); }
      rerender();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { input.removeEventListener('blur', commit); rerender(); }
    });
    return;
  }

  // --- Card + buttons ---
  const cardBtn = t.closest('.card-btn[data-action]');
  if (cardBtn) {
    handleAction(cardBtn.dataset.action);
    return;
  }

  // --- Settings / other action buttons ---
  const actionBtn = t.closest('[data-action]');
  if (actionBtn) {
    handleAction(actionBtn.dataset.action);
    return;
  }

  // --- Theme segmented buttons ---
  const themeBtn = t.closest('.theme-seg-btn[data-theme]');
  if (themeBtn) {
    setTheme(themeBtn.dataset.theme);
    return;
  }

  // --- Trash restore / delete-forever ---
  if (t.dataset.trashRestore) {
    restoreTrashEntry(t.dataset.trashRestore);
    return;
  }
  if (t.dataset.trashDel) {
    const ti = DATA.trash.findIndex(x => x.tid === t.dataset.trashDel);
    if (ti !== -1) {
      DATA.trash.splice(ti, 1);
      save();
      rerender();
      showToast('已彻底删除', 'success');
    }
    return;
  }
});

// ========================================================================
// ACTION DISPATCH
// ========================================================================
function handleAction(action) {
  switch (action) {
    case 'open-palette': openPalette(); break;
    case 'connect':
      storage.connect().then(() => {
        updateSyncIndicator();
        renderPage(currentPage);
        showToast('已连接数据文件夹，iCloud 同步已开启', 'success');
      }).catch((err) => {
        if (err && err.name !== 'AbortError') showToast(err.message || '连接失败', 'error');
      });
      break;
    case 'reconnect':
      storage.requestPermission().then((ok) => {
        updateSyncIndicator();
        renderPage(currentPage);
        showToast(ok ? '授权成功，同步已恢复' : '未获得授权', ok ? 'success' : 'warning');
      });
      break;
    case 'disconnect':
      showConfirm('断开数据文件夹', '断开后数据将仅保存在浏览器本地，不同步到其他设备。已保存的文件不受影响。', '断开', async () => {
        await storage.disconnect();
        updateSyncIndicator();
        renderPage(currentPage);
        showToast('已断开，切换到本地存储', 'warning');
      });
      break;
    case 'export': exportData('workspace'); break;
    case 'import': importData(); break;
    case 'reset': resetData(); break;
    case 'empty-trash': emptyTrash(); break;
    case 'show-onboarding': startOnboarding(true); break;
    case 'rollover-plan': rolloverPlan(); break;
    case 'gen-weekly-draft': genWeeklyDraft(); break;
    case 'add-plan-item': {
      const dayEl = document.getElementById('planDay');
      const typeEl = document.getElementById('planType');
      const targetEl = document.getElementById('planTarget');
      if (!dayEl || !typeEl) break;
      DATA.fitness.plan.push({
        id: uid(),
        day: dayEl.value,
        typeId: typeEl.value,
        target: targetEl ? targetEl.value.trim() : '',
        done: false
      });
      save();
      rerender();
      showToast('已添加到本周任务', 'success');
      break;
    }
    case 'add-workout-log':
      openWorkoutModal(null);
      break;
    case 'add-topcontent':
      showAddModal('添加表现最佳内容', [
        { label: '排名', placeholder: '🥇' },
        { label: '标题', placeholder: '内容标题' },
        { label: '数据描述', placeholder: '阅读 0k · 互动 0 · 收藏 0' }
      ], (vals) => {
        DATA.review.topContent.push({ id: uid(), rank: vals[0] || '📄', title: vals[1], desc: vals[2] });
        save(); rerender(); showToast('已添加', 'success');
      });
      break;
    case 'add-published':
      showAddModal('添加已发布剧集', [
        { label: '标题', placeholder: '第 X 集 · 标题' },
        { label: '数据描述', placeholder: '播放 0 · 点赞 0' }
      ], (vals) => {
        DATA.comic.published.push({ id: uid(), title: vals[0], desc: vals[1] });
        save(); rerender(); showToast('已添加', 'success');
      });
      break;
    case 'add-resource':
      showAddModal('添加学习资源', [
        { label: '标题', placeholder: '📚 资源名称' },
        { label: '描述', placeholder: '资源简介' }
      ], (vals) => {
        DATA.learning.ai.resources.push({ id: uid(), title: vals[0], desc: vals[1] });
        save(); rerender(); showToast('已添加', 'success');
      });
      break;
  }
}

    const titleInput = form ? form.querySelector('[data-field="title"]') : null;
    const descInput = form ? form.querySelector('[data-field="desc"]') : null;
    if (titleInput && titleInput.value.trim()) {
      addInspire(cat, titleInput.value.trim(), descInput ? descInput.value.trim() : '');
      showToast('已添加', 'success');
      setTimeout(() => {
        const ni = document.querySelector('.inspire-add-form [data-cat="' + cat + '"][data-field="title"]');
        if (ni) ni.focus();
      }, 50);

// ========================================================================
// INLINE EDITS (dblclick task text / contenteditable / bar value)
// ========================================================================
document.addEventListener('dblclick', (e) => {
  if (e.target.classList.contains('task-text')) {
    const path = e.target.dataset.path;
    const id = e.target.dataset.id;
    const arr = getNestedData(path);
    const task = arr ? arr.find(x => x.id === id) : null;
    if (!task) return;
    const input = document.createElement('input');
    input.className = 'task-text-edit';
    input.value = task.text;
    e.target.replaceWith(input);
    input.focus();
    input.select();
    const commit = () => {
      const v = input.value.trim();
      if (v) { task.text = v; save(); }
      rerender();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { input.removeEventListener('blur', commit); rerender(); }
    });
  }
});

document.addEventListener('blur', (e) => {
  const t = e.target;
  if (!t || !t.isContentEditable) return;
  const text = t.textContent.trim();

  if (t.dataset.reviewAction) {
    DATA.review.actions[t.dataset.reviewAction] = text;
    save();
  } else if (t.dataset.research) {
    DATA.learning.research.current[t.dataset.research] = text;
    save();
  } else if (t.dataset.comic) {
    DATA.comic.current[t.dataset.comic] = text;
    save();
  } else if (t.dataset.wr) {
    DATA.weeklyReview[t.dataset.wr] = text;
    save();
  }
}, true);

document.addEventListener('change', (e) => {
  if (e.target.classList.contains('bar-value-edit')) {
    if (e.target.dataset.cat === 'review.interaction') {
      DATA.review.interactionRate = Math.max(0, Math.min(100, parseInt(e.target.value) || 0));
      save();
      rerender();
    }
  }
});

// Checkbox keyboard support (Space/Enter on focused checkbox)
document.addEventListener('keydown', (e) => {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('task-checkbox')) {
    e.preventDefault();
    toggleTask(e.target.dataset.path, e.target.dataset.id);
  }
  if ((e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('checkin-row') && e.target.dataset.cat) {
    e.preventDefault();
    toggleCheckin(e.target.dataset.cat, e.target.dataset.id);
  }
});

// Save before unload (best-effort flush to localStorage safety net)
window.addEventListener('beforeunload', () => {
  if (DATA && saveState === 'saving') {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch (e) { /* ignore */ }
  }
});

// ========================================================================
// INIT
// ========================================================================
async function init() {
  await storage.init();

  const saved = await storage.read();
  if (saved && saved.version) {
    DATA = mergeDefaults(saved, DEFAULT_DATA);
  } else {
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    DATA.meta.deviceId = DEVICE_ID;
    await storage.write(DATA, { force: true });
  }

  // Housekeeping
  migrateFitnessData();
  purgeTrash();
  recordCheckinToday();
  recordWeeklyTrend();
  if (!DATA.meta) DATA.meta = { revision: 0, deviceId: DEVICE_ID, savedAt: '' };

  applyTheme();
  updateSyncIndicator();
  renderPage('dashboard');

  // First-run onboarding
  if (!DATA.settings.onboarded) {
    setTimeout(() => startOnboarding(false), 400);
  } else if (storage.mode === 'local' && storage.isFSAASupported) {
    setTimeout(() => showToast('提示：连接 data 文件夹以启用 iCloud 同步', 'warning', { duration: 4000 }), 1000);
  } else if (storage.mode === 'local' && !storage.isFSAASupported) {
    setTimeout(() => showToast('当前浏览器不支持文件同步，数据仅保存在本地', 'warning', { duration: 4000 }), 1000);
  }
}

init();
