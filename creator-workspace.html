<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI工作台</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    /* color — light */
    --bg: #f7fbff;
    --sidebar-bg: #ffffff;
    --card-bg: #ffffff;
    --overlay-bg: rgba(20, 30, 45, 0.4);
    --primary: #4a9eff;
    --primary-hover: #3a8eef;
    --primary-light: #e8f2ff;
    --primary-soft: #f0f7ff;
    --text-main: #2c3e50;
    --text-sub: #8da0b3;
    --text-muted: #b0c4d8;
    --border: #eef4fb;
    --shadow: 0 2px 12px rgba(74, 158, 255, 0.06);
    --shadow-hover: 0 4px 20px rgba(74, 158, 255, 0.12);
    --shadow-pop: 0 8px 40px rgba(0, 0, 0, 0.15);
    --danger: #ff6b6b;
    --success: #52c41a;
    --warning: #faad14;
    --success-soft: #e8f8ee;
    --warning-soft: #fff7e6;
    --danger-soft: #fff0f0;
    --neutral-soft: #f0f0f0;
    --skeleton-base: #eef4fb;
    --skeleton-shine: #f8fcff;

    /* shape */
    --radius: 16px;
    --radius-sm: 10px;

    /* spacing scale (4px base) */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
    --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-9: 36px; --sp-10: 40px;

    /* typography scale */
    --fs-display: 28px;
    --fs-h1: 22px;
    --fs-h2: 15px;
    --fs-body: 14px;
    --fs-small: 13px;
    --fs-caption: 12px;
    --fs-micro: 11px;

    /* z-index convention */
    --z-nav: 100;
    --z-drawer: 200;
    --z-backdrop: 190;
    --z-modal: 1000;
    --z-palette: 1100;
    --z-onboard: 1200;
    --z-toast: 2000;
  }

  [data-theme="dark"] {
    --bg: #0f141b;
    --sidebar-bg: #151c26;
    --card-bg: #1a2330;
    --overlay-bg: rgba(0, 0, 0, 0.55);
    --primary: #5aa9ff;
    --primary-hover: #7dbdff;
    --primary-light: #1d2f45;
    --primary-soft: #1b2839;
    --text-main: #e6edf5;
    --text-sub: #9db0c4;
    --text-muted: #5c7089;
    --border: #24303f;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.45);
    --shadow-pop: 0 8px 40px rgba(0, 0, 0, 0.6);
    --success-soft: #16301f;
    --warning-soft: #35290e;
    --danger-soft: #3a1d1d;
    --neutral-soft: #232d3b;
    --skeleton-base: #223041;
    --skeleton-shine: #2b3c50;
  }

  /* ============================================================
     BASE
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }

  :focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ============================================================
     SIDEBAR
     ============================================================ */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
    transition: background 0.2s ease, transform 0.25s ease;
    z-index: var(--z-nav);
  }

  .sidebar-header {
    padding: var(--sp-7) var(--sp-6) var(--sp-5);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-header .logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4a9eff, #7db8ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
  }

  .sidebar-header .title { font-size: 16px; font-weight: 600; color: var(--text-main); }
  .sidebar-header .subtitle { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 1px; }

  .sync-indicator {
    margin: 0 var(--sp-4) var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--sp-2);
    font-size: var(--fs-micro);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
    cursor: default;
  }
  .sync-indicator.connected { background: var(--success-soft); color: var(--success); }
  .sync-indicator.saving { background: var(--primary-soft); color: var(--primary); }
  .sync-indicator.local { background: var(--warning-soft); color: var(--warning); }
  .sync-indicator.offline { background: var(--neutral-soft); color: var(--text-muted); }
  .sync-indicator.error { background: var(--danger-soft); color: var(--danger); cursor: pointer; }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  .sync-indicator.connected .sync-dot { background: var(--success); }
  .sync-indicator.saving .sync-dot { background: var(--primary); animation: pulse 0.8s infinite; }
  .sync-indicator.local .sync-dot { background: var(--warning); }
  .sync-indicator.offline .sync-dot { background: var(--text-muted); animation: none; }
  .sync-indicator.error .sync-dot { background: var(--danger); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .menu-scroll { flex: 1; overflow-y: auto; }

  .menu-group { padding: var(--sp-2) var(--sp-3); }

  .menu-group-label {
    font-size: var(--fs-micro); color: var(--text-muted);
    padding: var(--sp-2) var(--sp-3) 6px; letter-spacing: 1px; font-weight: 500;
  }

  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px var(--sp-3); border-radius: var(--radius-sm);
    cursor: pointer; font-size: var(--fs-body); color: var(--text-sub);
    transition: all 0.2s ease; margin-bottom: 2px; user-select: none;
    min-height: 38px;
  }

  .menu-item .icon {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .menu-item:hover { background: var(--primary-soft); color: var(--text-main); }

  .menu-item.active {
    background: var(--primary); color: #fff; font-weight: 500;
    box-shadow: 0 2px 8px rgba(74, 158, 255, 0.3);
  }
  .menu-item.active .icon { color: #fff; }

  .sidebar-footer {
    padding: var(--sp-3) var(--sp-4) var(--sp-5);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }

  .theme-toggle {
    flex: 1;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: transparent; color: var(--text-sub);
    font-size: var(--fs-caption); cursor: pointer; font-family: inherit;
    transition: all 0.2s;
    min-height: 36px;
  }
  .theme-toggle:hover { background: var(--primary-soft); color: var(--text-main); }

  .kbd-hint {
    font-size: var(--fs-micro); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 7px; cursor: pointer; background: transparent; font-family: inherit;
    transition: all 0.2s;
  }
  .kbd-hint:hover { color: var(--primary); border-color: var(--primary); }

  /* Hamburger (mobile) */
  .hamburger {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: var(--z-drawer);
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text-main);
    font-size: 18px; cursor: pointer; box-shadow: var(--shadow);
    align-items: center; justify-content: center;
  }

  .drawer-backdrop {
    display: none;
    position: fixed; inset: 0; z-index: var(--z-backdrop);
    background: var(--overlay-bg);
    opacity: 0; transition: opacity 0.25s;
  }
  .drawer-backdrop.show { opacity: 1; }

  /* ============================================================
     MAIN
     ============================================================ */
  .main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-8) var(--sp-9) 120px; }
  .bottom-spacer { height: 80px; }

  .page-enter { animation: pageIn 0.22s ease; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-header { margin-bottom: var(--sp-6); display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-4); flex-wrap: wrap; }
  .main-header h1 { font-size: var(--fs-h1); font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
  .main-header .date { font-size: var(--fs-small); color: var(--text-muted); }
  .header-actions { display: flex; gap: var(--sp-2); }

  /* ============================================================
     CARDS
     ============================================================ */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: var(--sp-5);
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
    border: 1px solid var(--border);
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .zotero-row { grid-template-columns: 1fr 1fr; margin-top: var(--sp-5); }

  /* ============================================================
     OVERVIEW (总览) — hero, public info, KPI strip, layout
     ============================================================ */
  .ov-hero {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(292px, 336px);
    gap: var(--sp-6); margin-bottom: var(--sp-5); padding: 24px 26px; overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--primary) 15%, var(--border));
    border-radius: 20px; box-shadow: var(--shadow);
    background:
      radial-gradient(120% 150% at 100% 0%, color-mix(in srgb, var(--primary) 13%, transparent), transparent 62%),
      linear-gradient(128deg, color-mix(in srgb, var(--primary) 9%, var(--card-bg)), var(--card-bg) 56%);
  }
  .ov-hero::after {
    content: ''; position: absolute; right: -70px; top: -90px; width: 260px; height: 260px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--primary) 15%, transparent), transparent 68%);
  }
  .ov-hero-left { position: relative; z-index: 1; display: flex; flex-direction: column; min-width: 0; }
  .ov-eyebrow {
    display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
    padding: 4px 11px 4px 8px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--primary) 22%, var(--border));
    background: color-mix(in srgb, var(--card-bg) 76%, transparent);
    color: var(--primary); font-size: var(--fs-micro); font-weight: 650; letter-spacing: .02em;
  }
  .ov-eyebrow .ov-eyebrow-emoji { font-size: 13px; line-height: 1; }
  .ov-greeting {
    margin: 13px 0 2px; color: var(--text-main);
    font-size: clamp(20px, 2.1vw, 26px); font-weight: 700; letter-spacing: -.02em; line-height: 1.25;
  }
  .ov-greeting-sub { color: var(--text-sub); font-size: var(--fs-small); line-height: 1.6; }
  .ov-clock-row { display: flex; align-items: baseline; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .ov-clock {
    display: inline-flex; align-items: baseline; color: var(--text-main);
    font-size: clamp(38px, 4.6vw, 54px); font-weight: 250; line-height: 1;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .ov-clock-sec {
    margin-left: 3px; color: var(--primary); font-size: 0.42em; font-weight: 600;
    letter-spacing: 0; font-variant-numeric: tabular-nums;
  }
  .ov-clock-meridiem { margin-left: 8px; color: var(--text-muted); font-size: var(--fs-caption); font-weight: 600; letter-spacing: .06em; }
  .ov-datebar {
    display: flex; align-items: center; gap: 9px; margin-top: 10px; flex-wrap: wrap;
    color: var(--text-sub); font-size: var(--fs-small);
  }
  .ov-datebar strong { color: var(--text-main); font-weight: 620; }
  .ov-datebar .ov-chip {
    padding: 2px 9px; border-radius: 7px; background: color-mix(in srgb, var(--primary) 10%, var(--card-bg));
    border: 1px solid color-mix(in srgb, var(--primary) 14%, var(--border));
    color: var(--primary); font-size: var(--fs-micro); font-weight: 620;
  }
  .ov-dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
  .ov-daybar { margin-top: auto; padding-top: 20px; }
  .ov-daybar-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3);
    margin-bottom: 7px; color: var(--text-muted); font-size: var(--fs-micro);
  }
  .ov-daybar-head strong { color: var(--text-sub); font-weight: 620; font-variant-numeric: tabular-nums; }
  .ov-daybar-track {
    position: relative; height: 6px; border-radius: 999px; overflow: hidden;
    background: color-mix(in srgb, var(--primary) 12%, var(--border));
  }
  .ov-daybar-fill {
    height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.16,1,.3,1);
    background: linear-gradient(90deg, var(--primary), color-mix(in srgb, var(--primary) 45%, #8c7bea));
  }

  /* --- weather panel --- */
  .ov-weather {
    position: relative; z-index: 1; display: flex; flex-direction: column; gap: 13px;
    padding: 16px 17px; border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--primary) 13%, var(--border));
    background: color-mix(in srgb, var(--card-bg) 80%, transparent);
    backdrop-filter: blur(9px);
  }
  .ov-weather-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
  .ov-weather-place {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 4px 9px;
    border: 1px solid transparent; border-radius: 8px; background: transparent;
    color: var(--text-main); font: inherit; font-size: var(--fs-small); font-weight: 620;
    cursor: pointer; transition: background .18s ease, border-color .18s ease;
  }
  .ov-weather-place:hover { background: color-mix(in srgb, var(--primary) 9%, transparent); border-color: color-mix(in srgb, var(--primary) 18%, var(--border)); }
  .ov-weather-place .ov-caret { color: var(--text-muted); font-size: 9px; }
  .ov-weather-place-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-weather-locate {
    width: 27px; height: 27px; flex-shrink: 0; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg);
    color: var(--text-sub); font-size: 12px; cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  .ov-weather-locate:hover { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 32%, var(--border)); background: var(--primary-soft); }
  .ov-weather-now { display: flex; align-items: center; gap: 13px; }
  .ov-weather-glyph { font-size: 40px; line-height: 1; filter: saturate(1.05); }
  .ov-weather-temp {
    display: flex; align-items: flex-start; color: var(--text-main);
    font-size: 34px; font-weight: 350; line-height: 1; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  .ov-weather-temp sup { margin-top: 3px; font-size: .46em; font-weight: 500; }
  .ov-weather-desc { margin-top: 5px; color: var(--text-sub); font-size: var(--fs-caption); line-height: 1.5; }
  .ov-weather-metrics {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px;
    padding: 10px 0 1px; border-top: 1px solid var(--border);
  }
  .ov-weather-metric { text-align: center; }
  .ov-weather-metric span { display: block; color: var(--text-muted); font-size: 10px; letter-spacing: .02em; }
  .ov-weather-metric strong {
    display: block; margin-top: 3px; color: var(--text-main);
    font-size: var(--fs-caption); font-weight: 650; font-variant-numeric: tabular-nums;
  }
  .ov-weather-forecast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .ov-fc-day {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px;
    border-radius: 10px; background: color-mix(in srgb, var(--primary) 6%, transparent);
  }
  .ov-fc-day span:first-child { color: var(--text-muted); font-size: 10px; }
  .ov-fc-glyph { font-size: 16px; line-height: 1.2; }
  .ov-fc-day strong { color: var(--text-sub); font-size: 10px; font-weight: 620; font-variant-numeric: tabular-nums; }
  .ov-weather-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 156px; padding: var(--sp-3); text-align: center;
  }
  .ov-weather-state .ov-ws-glyph { font-size: 26px; opacity: .75; }
  .ov-weather-state .ov-ws-text { color: var(--text-sub); font-size: var(--fs-caption); line-height: 1.6; }
  .ov-weather-state .ov-ws-hint { color: var(--text-muted); font-size: var(--fs-micro); line-height: 1.6; }
  .ov-weather-skeleton {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, var(--skeleton-base), var(--skeleton-shine), var(--skeleton-base));
    background-size: 200% 100%; animation: ovSkeleton 1.3s ease-in-out infinite;
  }
  @keyframes ovSkeleton {
    from { background-position: 140% 0; }
    to { background-position: -40% 0; }
  }
  .ov-weather-updated { color: var(--text-muted); font-size: 10px; text-align: right; }

  /* --- KPI strip --- */
  .ov-kpis {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-3); margin-bottom: var(--sp-5);
  }
  .ov-kpi {
    display: flex; align-items: center; gap: 12px; padding: 15px 16px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--card-bg);
    box-shadow: var(--shadow); transition: box-shadow .2s ease, transform .2s ease;
  }
  .ov-kpi:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .ov-kpi-glyph {
    width: 38px; height: 38px; flex-shrink: 0; display: grid; place-items: center;
    border-radius: 11px; font-size: 17px;
    background: color-mix(in srgb, var(--kpi-accent, var(--primary)) 13%, var(--card-bg));
    color: var(--kpi-accent, var(--primary));
  }
  .ov-kpi-body { min-width: 0; }
  .ov-kpi-value {
    display: flex; align-items: baseline; gap: 3px; color: var(--text-main);
    font-size: 21px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .ov-kpi-value small { color: var(--text-muted); font-size: 11px; font-weight: 600; }
  .ov-kpi-label {
    margin-top: 3px; color: var(--text-muted); font-size: var(--fs-micro);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* --- two-column body --- */
  .ov-grid { display: grid; grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
  .ov-col { display: flex; flex-direction: column; gap: var(--sp-5); min-width: 0; }
  .ov-focus-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: 15px; }
  .ov-focus-ring { display: flex; align-items: center; gap: 15px; }
  .ov-inline-hint { color: var(--text-muted); font-size: var(--fs-micro); }

  @media (max-width: 1180px) {
    .ov-hero { grid-template-columns: 1fr; }
    .ov-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .ov-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    .ov-hero { padding: 20px 18px; border-radius: 16px; }
    .ov-daybar { padding-top: 16px; }
  }

  /* Research idea modal (new / edit) */
  .research-idea-modal-title { margin: 0 0 2px; color: var(--text-main); font-size: 17px; font-weight: 700; }
  .research-idea-modal-sub { margin: 0 0 14px; color: var(--text-muted); font-size: var(--fs-caption); line-height: 1.55; }
  .research-idea-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .research-idea-modal-btn { padding: 9px 18px; border-radius: 9px; border: 0; font: inherit; font-size: var(--fs-small); font-weight: 620; cursor: pointer; transition: background .18s ease, transform .18s cubic-bezier(.16,1,.3,1); }
  .research-idea-modal-btn:hover { transform: translateY(-1px); }
  .research-idea-modal-btn.cancel { background: var(--neutral-soft); color: var(--text-sub); }
  .research-idea-modal-btn.cancel:hover { background: var(--border); }
  .research-idea-modal-btn.confirm { background: var(--primary); color: #fff; }
  .research-idea-modal-btn.confirm:hover { background: var(--primary-hover); }
  .research-idea-modal-btn.confirm:disabled { opacity: .55; cursor: default; transform: none; }
  .research-idea-modal-btn.danger { background: var(--danger); color: #fff; }
  .research-idea-modal-btn.danger:hover { background: #e55; }

  /* Research inspiration workspace */
  .research-idea-page { --idea-accent: #596cdb; --idea-accent-soft: color-mix(in srgb, var(--idea-accent) 10%, var(--card-bg)); }

  .research-paper-delete:hover { border-color: color-mix(in srgb, var(--danger) 24%, var(--border)); color: var(--danger); }
  .research-paper-progress-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 20px 0 10px; }

  .research-paper-sections { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .research-paper-section { min-height: 54px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); color: var(--text-sub); font: inherit; font-size: 10px; text-align: left; cursor: pointer; }
  .research-paper-section::before { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 7px; border-radius: 6px; background: var(--neutral-soft); color: var(--text-muted); content: '·'; font-weight: 800; }
  .research-paper-section.is-done { border-color: color-mix(in srgb, #58a86b 26%, var(--border)); background: color-mix(in srgb, #58a86b 7%, var(--card-bg)); color: #397648; }
  .research-paper-section.is-done::before { background: #58a86b; color: #fff; content: '✓'; }
  .research-submission { margin-top: 22px; padding: 18px; border: 1px solid var(--border); border-radius: 13px; background: color-mix(in srgb, var(--card-bg) 96%, var(--bg)); }

  .research-submission-step.is-reached { border-color: color-mix(in srgb, var(--paper-accent) 25%, var(--border)); background: color-mix(in srgb, var(--paper-accent) 7%, var(--card-bg)); color: var(--paper-accent); }
  .research-submission-step.is-active { border-color: var(--paper-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--paper-accent) 9%, transparent); }

  .research-paper-notes { margin-top: 15px; }

  .research-paper-notes textarea { width: 100%; min-height: 64px; box-sizing: border-box; padding: 11px; overflow: hidden; resize: none; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); color: var(--text-main); font: inherit; font-size: var(--fs-caption); line-height: 1.7; outline: none; }
  .research-paper-notes textarea:focus { border-color: var(--paper-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--paper-accent) 8%, transparent); }

  /* Research action workspace */
  .research-todo-page { --todo-accent: #4876c8; }
  .research-todo-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 520px); gap: 22px; align-items: center; margin-bottom: 14px; padding: 22px 24px; border: 1px solid color-mix(in srgb, var(--todo-accent) 16%, var(--border)); border-radius: 18px; background: linear-gradient(128deg, color-mix(in srgb, var(--todo-accent) 8%, var(--card-bg)), var(--card-bg) 66%); box-shadow: var(--shadow); }
  .research-todo-eyebrow { color: var(--todo-accent); font-size: 9px; font-weight: 780; letter-spacing: .13em; text-transform: uppercase; }
  .research-todo-hero h2 { margin: 7px 0 5px; color: var(--text-main); font-size: clamp(22px, 2.4vw, 31px); letter-spacing: -.025em; }
  .research-todo-hero p { max-width: 610px; margin: 0; color: var(--text-muted); font-size: var(--fs-caption); line-height: 1.6; }
  .research-todo-capture { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid color-mix(in srgb, var(--todo-accent) 14%, var(--border)); border-radius: 13px; background: var(--card-bg); }
  .research-todo-capture::before { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; background: color-mix(in srgb, var(--todo-accent) 9%, var(--card-bg)); color: var(--todo-accent); content: '+'; font-size: 18px; }
  .research-todo-capture input { min-width: 0; height: 38px; border: 0; outline: 0; background: transparent; color: var(--text-main); font: inherit; font-size: var(--fs-small); }
  .research-todo-title-input { flex: 1; }
  .research-todo-due-input { width: 142px; padding: 0 9px; border-left: 1px solid var(--border) !important; color: var(--text-sub) !important; font-size: 10px !important; }
  .research-todo-capture button { height: 36px; padding: 0 13px; border: 0; border-radius: 9px; background: var(--todo-accent); color: #fff; font: inherit; font-size: var(--fs-micro); font-weight: 700; cursor: pointer; }
  .research-todo-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 14px; }
  .research-todo-stat { padding: 13px 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); }
  .research-todo-stat strong { display: block; color: var(--text-main); font-size: 20px; line-height: 1; }
  .research-todo-stat span { display: block; margin-top: 6px; color: var(--text-muted); font-size: 9px; }
  .research-todo-stat.is-risk strong { color: var(--danger); }
  .research-todo-panel { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--card-bg); box-shadow: var(--shadow); }
  .research-todo-toolbar { display: flex; align-items: center; gap: 9px; padding: 13px 15px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--card-bg) 96%, var(--bg)); }
  .research-todo-scopes { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--neutral-soft); }
  .research-todo-scope { min-height: 29px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text-muted); font: inherit; font-size: 9px; font-weight: 650; cursor: pointer; }
  .research-todo-scope.is-active { background: var(--card-bg); color: var(--todo-accent); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .research-todo-search { min-width: 150px; height: 36px; flex: 1; padding: 0 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); color: var(--text-main); font: inherit; font-size: var(--fs-caption); outline: none; }
  .research-todo-filter { max-width: 190px; height: 36px; padding: 0 30px 0 9px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); color: var(--text-sub); font: inherit; font-size: 10px; outline: none; }
  .research-todo-body { padding: 8px 18px 20px; }
  .research-todo-group { padding-top: 12px; }
  .research-todo-group-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 7px; color: var(--text-sub); font-size: 10px; font-weight: 720; }
  .research-todo-group-head::after { height: 1px; flex: 1; background: var(--border); content: ''; }
  .research-todo-group-head span { color: var(--text-muted); font-size: 9px; font-weight: 550; }
  .research-todo-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 11px; align-items: center; margin-bottom: 6px; padding: 11px 12px; border: 1px solid transparent; border-radius: 11px; background: var(--card-bg); transition: border-color .15s ease, background .15s ease; }
  .research-todo-row:hover { border-color: var(--border); background: color-mix(in srgb, var(--card-bg) 97%, var(--todo-accent)); }
  .research-todo-row.is-done { opacity: .65; }
  .research-todo-check { width: 21px; height: 21px; display: grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--todo-accent) 40%, var(--border)); border-radius: 7px; background: var(--card-bg); color: #fff; cursor: pointer; }
  .research-todo-check.is-done { border-color: #58a86b; background: #58a86b; }
  .research-todo-main { min-width: 0; }
  .research-todo-title { overflow: hidden; color: var(--text-main); font-size: var(--fs-caption); font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
  .research-todo-row.is-done .research-todo-title { text-decoration: line-through; }
  .research-todo-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .research-todo-chip { padding: 3px 6px; border-radius: 6px; background: var(--neutral-soft); color: var(--text-muted); font-size: 8px; }
  .research-todo-chip.is-high { background: color-mix(in srgb, var(--danger) 8%, var(--card-bg)); color: var(--danger); }
  .research-todo-chip.is-due { background: color-mix(in srgb, #d78a33 9%, var(--card-bg)); color: #a86520; }
  .research-todo-chip.is-overdue { background: color-mix(in srgb, var(--danger) 9%, var(--card-bg)); color: var(--danger); }
  .research-todo-edit { width: 29px; height: 29px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; }
  .research-todo-edit:hover { border-color: var(--border); background: var(--card-bg); color: var(--todo-accent); }
  .research-todo-empty { padding: 70px 20px; color: var(--text-muted); font-size: var(--fs-caption); line-height: 1.7; text-align: center; }
  .research-todo-modal-title { margin-bottom: 5px; color: var(--text-main); font-size: 20px; font-weight: 760; }
  .research-todo-modal-sub { margin-bottom: 16px; color: var(--text-muted); font-size: var(--fs-caption); }
  .research-todo-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .research-todo-form-field.full { grid-column: 1 / -1; }
  .research-todo-form-field label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 9px; font-weight: 700; }
  .research-todo-form-field input, .research-todo-form-field select, .research-todo-form-field textarea { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text-main); font: inherit; font-size: var(--fs-caption); outline: none; }
  .research-todo-form-field textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .research-todo-form-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 17px; }
  .research-todo-form-actions > div { display: flex; gap: 8px; }
  .research-idea-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .research-idea-form-field { min-width: 0; }
  .research-idea-form-field.full { grid-column: 1 / -1; }
  .research-idea-form-field label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: var(--fs-micro); font-weight: 700; letter-spacing: .04em; }
  .research-idea-form-field input[type="text"], .research-idea-form-field input[type="date"], .research-idea-form-field select, .research-idea-form-field textarea { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text-main); font: inherit; font-size: var(--fs-caption); outline: none; }
  .research-idea-form-field input:focus, .research-idea-form-field select:focus, .research-idea-form-field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent); }
  .research-idea-form-field textarea { resize: vertical; min-height: 92px; line-height: 1.7; }
  .research-idea-form-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); }
  .research-idea-form-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: var(--primary-light); color: var(--primary); font-size: var(--fs-micro); font-weight: 680; }
  .research-idea-form-tag button { border: 0; background: transparent; color: inherit; font: inherit; font-size: 12px; line-height: 1; cursor: pointer; padding: 0; }
  .research-idea-form-tag button:hover { color: var(--danger); }
  .research-idea-form-tag-input { min-width: 110px; flex: 1; border: 0; background: transparent; color: var(--text-main); font: inherit; font-size: var(--fs-caption); outline: none; padding: 2px 0; }

  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-4); gap: var(--sp-2); }
  .card-title { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-h2); font-weight: 600; color: var(--text-main); }
  .card-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

  .card-tag {
    font-size: var(--fs-micro); padding: 3px 10px; border-radius: 20px;
    background: var(--primary-light); color: var(--primary); font-weight: 500;
    white-space: nowrap;
  }

  .card-actions { display: flex; gap: 6px; }
  .card-btn {
    width: 26px; height: 26px; border-radius: 7px; border: none;
    background: var(--primary-soft); color: var(--primary); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .card-btn:hover { background: var(--primary); color: #fff; }

  /* ============================================================
     TASK LIST
     ============================================================ */
  .task-list { list-style: none; }
  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: var(--sp-2) 0; font-size: var(--fs-small); color: var(--text-sub);
    position: relative;
    animation: itemIn 0.25s ease both;
  }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-checkbox {
    width: 18px; height: 18px; border: 2px solid var(--text-muted);
    border-radius: 5px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .task-checkbox.done { background: var(--primary); border-color: var(--primary); color: #fff; font-size: var(--fs-micro); }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text-muted); }

  .task-text { flex: 1; cursor: pointer; }
  .task-text-edit {
    flex: 1; border: 1px solid var(--primary); border-radius: 5px;
    padding: 2px 6px; font-size: var(--fs-small); font-family: inherit;
    color: var(--text-main); outline: none; background: var(--card-bg);
  }

  .task-delete {
    opacity: 0; width: 22px; height: 22px; border-radius: 5px; border: none;
    background: transparent; color: var(--danger); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s; flex-shrink: 0;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: var(--danger-soft); }

  .add-task-row {
    display: flex; gap: var(--sp-2); margin-top: var(--sp-2);
  }
  .add-task-input {
    flex: 1; border: 1px dashed var(--text-muted); border-radius: var(--sp-2);
    padding: 7px var(--sp-3); font-size: var(--fs-small); font-family: inherit;
    color: var(--text-main); outline: none; transition: border-color 0.2s;
    background: transparent; min-width: 0;
  }
  .add-task-input:focus { border-style: solid; border-color: var(--primary); }
  .add-task-input::placeholder { color: var(--text-muted); }

  .add-task-input.input-error {
    border-color: var(--danger); border-style: solid;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .inspire-add-form {
    display: flex; flex-direction: column; gap: var(--sp-2); margin-top: 10px;
    width: 100%; box-sizing: border-box;
  }
  .inspire-add-form .add-task-input {
    width: 100%; box-sizing: border-box; min-width: 0;
  }
  .inspire-add-form .add-btn { align-self: flex-end; }

  .add-btn {
    padding: 7px 14px; border-radius: var(--sp-2); border: none;
    background: var(--primary); color: #fff; font-size: var(--fs-small);
    cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap;
  }
  .add-btn:hover { background: var(--primary-hover); }
  .add-btn:disabled { background: var(--text-muted); cursor: not-allowed; }

  .clear-done-row {
    margin-top: var(--sp-2);
    text-align: right;
  }
  .clear-done-btn {
    border: none; background: transparent; color: var(--text-muted);
    font-size: var(--fs-caption); cursor: pointer; font-family: inherit;
    padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
  }
  .clear-done-btn:hover { color: var(--danger); background: var(--danger-soft); }

  /* ============================================================
     PROGRESS RING / BARS
     ============================================================ */
  .progress-ring { display: flex; align-items: center; gap: var(--sp-5); }
  .ring-svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--primary-soft); }
  .ring-fill { stroke: var(--primary); transition: stroke-dashoffset 0.6s ease; stroke-linecap: round; }

  .ring-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
  .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .ring-percent { font-size: var(--fs-h1); font-weight: 700; color: var(--primary); }
  .ring-label { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }

  .progress-info { flex: 1; }
  .progress-info .label { font-size: var(--fs-small); color: var(--text-sub); margin-bottom: 4px; }
  .progress-info .value { font-size: 20px; font-weight: 600; color: var(--text-main); }
  .progress-info .hint { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; }

  .bar-item { margin-bottom: 14px; }
  .bar-item:last-child { margin-bottom: 0; }
  .bar-header { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--text-sub); margin-bottom: 6px; }
  .bar-track { height: 6px; background: var(--primary-soft); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .bar-track-readonly { cursor: default; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #4a9eff, #7db8ff); border-radius: 10px; transition: width 0.5s ease; }

  .bar-value-group { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; }
  .bar-value-edit {
    font-size: var(--fs-caption); color: var(--primary); border: 1px solid var(--primary);
    border-radius: 4px; padding: 0 4px; width: 50px; font-family: inherit; outline: none;
    text-align: center; background: var(--card-bg);
  }
  .bar-value-text { font-size: var(--fs-caption); color: var(--primary); font-weight: 600; }

  /* ============================================================
     CHECK-IN
     ============================================================ */
  .checkin-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.2s;
    animation: itemIn 0.25s ease both;
    min-height: 40px;
  }
  .checkin-row:last-child { border-bottom: none; }
  .checkin-row:hover { background: var(--primary-soft); border-radius: 6px; padding-left: 6px; padding-right: 6px; }

  .checkin-name { font-size: var(--fs-small); color: var(--text-sub); display: flex; align-items: center; gap: var(--sp-2); }
  .checkin-name .ci-icon { font-size: 16px; }

  .checkin-status { font-size: var(--fs-caption); padding: 3px var(--sp-3); border-radius: 20px; font-weight: 500; transition: all 0.2s; }
  .checkin-status.done { background: var(--success-soft); color: var(--success); }
  .checkin-status.pending { background: var(--warning-soft); color: var(--warning); }

  /* Heatmap */
  .heatmap-wrap { overflow-x: auto; padding-bottom: var(--sp-2); }
  .heatmap {
    display: grid;
    grid-template-rows: repeat(7, 11px);
    grid-auto-flow: column;
    grid-auto-columns: 11px;
    gap: 3px;
  }
  .hm-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--primary-soft); }
  .hm-cell.h1 { background: rgba(74,158,255,0.35); }
  .hm-cell.h2 { background: rgba(74,158,255,0.55); }
  .hm-cell.h3 { background: rgba(74,158,255,0.78); }
  .hm-cell.h4 { background: var(--primary); }
  .hm-cell.future { background: transparent; }
  .heatmap-legend {
    display: flex; align-items: center; gap: 4px; justify-content: flex-end;
    font-size: var(--fs-micro); color: var(--text-muted); margin-top: var(--sp-2);
  }
  .heatmap-legend .hm-cell { display: inline-block; }

  .reading-log-scroll {
    flex: 1 1 auto;
    min-height: 0;
    max-height: clamp(420px, 54vh, 720px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .reading-log-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--sp-3);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    animation: itemIn 0.25s ease both;
  }
  .reading-log-row:last-child { border-bottom: none; }
  .reading-log-row:hover { background: var(--primary-soft); border-radius: 7px; padding-left: 8px; padding-right: 8px; }
  .reading-log-main { min-width: 0; }
  .reading-log-title { color: var(--text-main); font-size: var(--fs-small); font-weight: 620; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reading-log-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
  .reading-log-pill { max-width: 150px; padding: 2px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: var(--fs-micro); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reading-log-date { color: var(--text-muted); font-size: var(--fs-micro); font-variant-numeric: tabular-nums; }

  /* Fitness plan rows */
  .fit-plan-row {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 10px 0; border-bottom: 1px solid var(--border);
    animation: itemIn 0.25s ease both;
  }
  .fit-plan-row:last-child { border-bottom: none; }
  .fit-plan-row .fp-icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
  .fit-plan-row .fp-main { flex: 1; min-width: 0; cursor: pointer; }
  .fit-plan-row .fp-name { font-size: var(--fs-small); color: var(--text-main); }
  .fit-plan-row .fp-target { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }
  .fit-plan-row.done .fp-name { text-decoration: line-through; color: var(--text-muted); }

  .fit-log-row {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: var(--fs-small);
  }
  .fit-log-row:last-child { border-bottom: none; }
  .fit-log-row .fl-icon { font-size: 15px; flex-shrink: 0; }
  .fit-log-row .fl-main { flex: 1; min-width: 0; }
  .fit-log-row .fl-title { color: var(--text-main); }
  .fit-log-row .fl-meta { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }

  .chip-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-sub); font-size: var(--fs-caption);
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

  .fit-add-form { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: 10px; }
  .fit-add-row { display: flex; gap: var(--sp-2); }
  .fit-add-row .add-task-input { flex: 1; }
  .fit-select {
    border: 1px dashed var(--text-muted); border-radius: var(--sp-2);
    padding: 7px var(--sp-3); font-size: var(--fs-small); font-family: inherit;
    color: var(--text-main); outline: none; background: transparent; cursor: pointer;
  }
  .fit-select:focus { border-style: solid; border-color: var(--primary); }

  /* ============================================================
     INSPIRE / NEWS ITEMS
     ============================================================ */
  .inspire-item {
    padding: 10px 0; border-bottom: 1px solid var(--border);
    position: relative;
    animation: itemIn 0.25s ease both;
  }
  .inspire-item:last-child { border-bottom: none; }
  .inspire-title { font-size: var(--fs-small); color: var(--text-main); font-weight: 500; margin-bottom: 4px; }
  .inspire-desc { font-size: var(--fs-caption); color: var(--text-muted); line-height: 1.5; }

  .inspire-delete {
    position: absolute; top: 10px; right: 0;
    opacity: 0; width: 22px; height: 22px; border-radius: 5px; border: none;
    background: transparent; color: var(--danger); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .inspire-item:hover .inspire-delete { opacity: 1; }
  .inspire-delete:hover { background: var(--danger-soft); }

  /* ============================================================
     STATS
     ============================================================ */
  .stat-row { display: flex; gap: var(--sp-4); margin-top: 14px; }
  .stat-box {
    flex: 1; text-align: center; background: var(--primary-soft);
    border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-2);
    transition: background 0.2s; cursor: pointer;
  }
  .stat-box:hover { background: var(--primary-light); }
  .stat-box.readonly { cursor: default; }
  .stat-box.readonly:hover { background: var(--primary-soft); }
  .stat-num { font-size: 20px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: var(--fs-micro); color: var(--text-muted); margin-top: 2px; }

  .stat-num-edit {
    font-size: 20px; font-weight: 700; color: var(--primary);
    border: 1px solid var(--primary); border-radius: 5px;
    padding: 0 4px; width: 100%; text-align: center; font-family: inherit;
    outline: none; background: var(--card-bg);
  }

  /* ============================================================
     EMPTY STATE
     ============================================================ */
  .empty-state {
    text-align: center; padding: var(--sp-8) var(--sp-5);
    color: var(--text-muted); font-size: var(--fs-small);
  }
  .empty-state .emoji { font-size: 36px; margin-bottom: var(--sp-3); }
  .empty-state .empty-text { margin-bottom: 2px; }
  .empty-state .empty-hint { font-size: var(--fs-caption); opacity: 0.8; }

  /* ============================================================
     SKELETON
     ============================================================ */
  .skel {
    position: relative; overflow: hidden;
    background: var(--skeleton-base); border-radius: 6px;
  }
  .skel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
    animation: shimmer 1.4s infinite;
    transform: translateX(-100%);
  }
  @keyframes shimmer {
    to { transform: translateX(100%); }
  }
  .skel-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 22px; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .skel-line { height: 12px; margin-bottom: var(--sp-3); }
  .skel-title { height: 16px; width: 40%; margin-bottom: var(--sp-5); }

  /* ============================================================
     MODAL
     ============================================================ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: var(--overlay-bg); z-index: var(--z-modal);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--card-bg); border-radius: var(--radius); padding: var(--sp-7);
    width: 420px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
    box-shadow: var(--shadow-pop);
    transform: scale(0.95); transition: transform 0.2s;
    border: 1px solid var(--border);
  }
  .modal-overlay.show .modal { transform: scale(1); }

  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; color: var(--text-main); }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: var(--fs-caption); color: var(--text-sub); margin-bottom: 6px; }
  .modal-field input, .modal-field textarea {
    width: 100%; border: 1px solid var(--border); border-radius: var(--sp-2);
    padding: 9px var(--sp-3); font-size: var(--fs-body); font-family: inherit;
    color: var(--text-main); outline: none; transition: border-color 0.2s;
    background: var(--bg);
  }
  .modal-field input:focus, .modal-field textarea:focus { border-color: var(--primary); }
  .modal-field textarea { resize: vertical; min-height: 60px; }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: var(--sp-5); flex-wrap: wrap; }
  .modal-btn {
    padding: var(--sp-2) 18px; border-radius: var(--sp-2); border: none;
    font-size: var(--fs-small); cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .modal-btn.cancel { background: var(--neutral-soft); color: var(--text-sub); }
  .modal-btn.cancel:hover { background: var(--border); }
  .modal-btn.confirm { background: var(--primary); color: #fff; }
  .modal-btn.confirm:hover { background: var(--primary-hover); }
  .modal-btn.danger { background: var(--danger); color: #fff; }
  .modal-btn.danger:hover { background: #e55; }
  .modal-btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .modal-btn.outline:hover { background: var(--primary-soft); }

  /* ============================================================
     TOAST
     ============================================================ */
  .toast-container {
    position: fixed; bottom: var(--sp-6); right: var(--sp-6); z-index: var(--z-toast);
    display: flex; flex-direction: column; gap: var(--sp-2);
    max-width: min(360px, calc(100vw - 32px));
  }
  .toast {
    background: var(--card-bg); border-radius: var(--radius-sm); padding: 10px 18px;
    font-size: var(--fs-small); color: var(--text-main); box-shadow: var(--shadow-pop);
    display: flex; align-items: center; gap: var(--sp-2);
    animation: toastIn 0.3s ease; border-left: 3px solid var(--primary);
    border: 1px solid var(--border); border-left-width: 3px;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.warning { border-left-color: var(--warning); }
  .toast.error { border-left-color: var(--danger); }
  .toast-action {
    border: none; background: var(--primary-soft); color: var(--primary);
    font-size: var(--fs-caption); font-weight: 600; cursor: pointer;
    padding: 4px 10px; border-radius: 6px; font-family: inherit;
    margin-left: auto; white-space: nowrap; transition: all 0.2s;
  }
  .toast-action:hover { background: var(--primary); color: #fff; }

  @keyframes toastIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes toastOut {
    to { transform: translateX(100%); opacity: 0; }
  }

  /* ============================================================
     COMMAND PALETTE
     ============================================================ */
  .palette-overlay {
    position: fixed; inset: 0; z-index: var(--z-palette);
    background: var(--overlay-bg);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 12vh;
    opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  .palette-overlay.show { opacity: 1; pointer-events: auto; }
  .palette {
    width: 560px; max-width: 92vw;
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow-pop); border: 1px solid var(--border);
    overflow: hidden;
    transform: translateY(-8px); transition: transform 0.18s;
  }
  .palette-overlay.show .palette { transform: translateY(0); }
  .palette-input-row {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border);
  }
  .palette-input-row .p-icon { font-size: 16px; color: var(--text-muted); }
  .palette-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text-main); font-family: inherit;
  }
  .palette-input::placeholder { color: var(--text-muted); }
  .palette-kbd {
    font-size: var(--fs-micro); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px;
  }
  .palette-list { max-height: 320px; overflow-y: auto; padding: var(--sp-2); }
  .palette-group-label {
    font-size: var(--fs-micro); color: var(--text-muted);
    padding: var(--sp-2) var(--sp-3) 4px; letter-spacing: 0.5px;
  }
  .palette-item {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 9px var(--sp-3); border-radius: var(--radius-sm);
    cursor: pointer; font-size: var(--fs-small); color: var(--text-main);
  }
  .palette-item .pi-icon { width: 22px; text-align: center; flex-shrink: 0; }
  .palette-item .pi-meta { margin-left: auto; font-size: var(--fs-micro); color: var(--text-muted); flex-shrink: 0; }
  .palette-item.selected { background: var(--primary-soft); }
  .palette-item.selected .pi-meta { color: var(--primary); }
  .palette-empty { padding: var(--sp-8); text-align: center; color: var(--text-muted); font-size: var(--fs-small); }

  /* ============================================================
     ONBOARDING
     ============================================================ */
  .onboard-overlay {
    position: fixed; inset: 0; z-index: var(--z-onboard);
    background: var(--overlay-bg);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .onboard-overlay.show { opacity: 1; pointer-events: auto; }
  .onboard {
    width: 460px; max-width: 92vw;
    background: var(--card-bg); border-radius: var(--radius);
    padding: var(--sp-8); box-shadow: var(--shadow-pop);
    border: 1px solid var(--border); text-align: center;
  }
  .onboard .ob-emoji { font-size: 44px; margin-bottom: var(--sp-4); }
  .onboard .ob-title { font-size: 18px; font-weight: 600; margin-bottom: var(--sp-3); color: var(--text-main); }
  .onboard .ob-desc { font-size: var(--fs-small); color: var(--text-sub); line-height: 1.7; margin-bottom: var(--sp-6); text-align: left; }
  .onboard .ob-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: var(--sp-5); }
  .onboard .ob-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.2s; }
  .onboard .ob-dot.active { background: var(--primary); width: 20px; border-radius: 4px; }
  .onboard .ob-actions { display: flex; gap: var(--sp-3); justify-content: center; }

  /* ============================================================
     SETTINGS
     ============================================================ */
  .settings-card {
    background: var(--card-bg); border-radius: var(--radius); padding: var(--sp-6);
    box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: var(--sp-5);
  }
  .settings-card h3 { font-size: var(--fs-h2); font-weight: 600; margin-bottom: var(--sp-4); color: var(--text-main); }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--sp-3) 0; border-bottom: 1px solid var(--border);
    gap: var(--sp-3); flex-wrap: wrap;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: var(--fs-body); color: var(--text-main); }
  .settings-desc { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 3px; line-height: 1.6; }
  .settings-value { font-size: var(--fs-small); color: var(--text-sub); }

  .btn {
    padding: var(--sp-2) var(--sp-4); border-radius: var(--sp-2); border: none;
    font-size: var(--fs-small); cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: var(--primary-soft); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-sm { padding: 4px 10px; font-size: var(--fs-caption); }

  .theme-seg { display: flex; gap: 6px; }
  .theme-seg-btn {
    padding: 6px 14px; border-radius: var(--sp-2); border: 1px solid var(--border);
    background: transparent; color: var(--text-sub); font-size: var(--fs-caption);
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .theme-seg-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .storage-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px var(--sp-3); border-radius: 20px; font-size: var(--fs-caption); font-weight: 500;
  }
  .storage-badge.fsaa { background: var(--success-soft); color: var(--success); }
  .storage-badge.local { background: var(--warning-soft); color: var(--warning); }

  .trash-item {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: var(--fs-small);
  }
  .trash-item:last-child { border-bottom: none; }
  .trash-item .t-text { flex: 1; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trash-item .t-meta { font-size: var(--fs-micro); color: var(--text-muted); flex-shrink: 0; }

  code.inline-code {
    background: var(--primary-soft); padding: 1px 5px; border-radius: 4px;
    font-size: 0.92em;
  }

  /* ============================================================
     TREND CHART
     ============================================================ */
  .trend-chart { width: 100%; height: auto; display: block; }
  .trend-dot { fill: var(--primary); }
  .trend-line { stroke: var(--primary); stroke-width: 2; fill: none; }
  .trend-area { fill: rgba(74, 158, 255, 0.12); }
  .trend-label { font-size: 9px; fill: var(--text-muted); }

  /* ============================================================
     ZOTERO
     ============================================================ */
  .zotero-toolbar { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .zotero-toolbar .fit-select { min-width: 150px; flex: 1 1 180px; }
  .zotero-toolbar .add-task-input { min-width: 180px; flex: 2 1 240px; }
  .zotero-list { display: flex; flex-direction: column; gap: var(--sp-2); max-height: 340px; overflow-y: auto; }
  .zotero-library-meta { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .zotero-count-badge { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); background: var(--bg); font-size: var(--fs-micro); font-variant-numeric: tabular-nums; }
  .zotero-pagination { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--border); }
  .zotero-pagination-status { color: var(--text-muted); font-size: var(--fs-caption); line-height: 1.5; }
  .zotero-load-more[disabled] { cursor: wait; opacity: 0.62; }
  .zotero-detail-body { max-height: 340px; overflow-y: auto; }
  .zotero-item { width: 100%; text-align: left; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--sp-3); background: transparent; color: var(--text-main); font: inherit; cursor: pointer; }
  .zotero-item:hover, .zotero-item.selected { background: var(--primary-soft); border-color: var(--primary); }
  .zotero-item-title, .zotero-item-meta { display: block; }
  .zotero-item-title { font-size: var(--fs-small); font-weight: 500; line-height: 1.5; }
  .zotero-item-meta { margin-top: 4px; font-size: var(--fs-caption); color: var(--text-muted); line-height: 1.5; }
  .zotero-paper-info { padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
  .zotero-paper-title { font-size: var(--fs-body); font-weight: 600; line-height: 1.55; color: var(--text-main); }
  .zotero-paper-meta { margin-top: 7px; font-size: var(--fs-caption); line-height: 1.7; color: var(--text-sub); }
  .zotero-paper-abstract { margin-top: var(--sp-3); font-size: var(--fs-caption); line-height: 1.75; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .zotero-note-section-title { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin: var(--sp-4) 0 var(--sp-2); }
  .zotero-note-section-title .settings-label { margin: 0; }
  .zotero-note-preview { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: var(--sp-3); padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--primary-soft); }
  .zotero-note-preview-main { min-width: 0; }
  .zotero-note-preview-title { font-size: var(--fs-small); font-weight: 600; line-height: 1.5; color: var(--text-main); }
  .zotero-note-preview-text { margin-top: 7px; font-size: var(--fs-caption); line-height: 1.75; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .zotero-note-preview-meta { margin-top: 8px; font-size: var(--fs-micro); color: var(--text-muted); }
  .zotero-read-btn { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }

  .literature-overview-card {
    position: relative;
    overflow: hidden;
    margin-bottom: var(--sp-5);
    padding: 0;
    border: 1px solid color-mix(in srgb, var(--primary) 18%, var(--border));
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-bg) 94%, var(--primary)), var(--card-bg) 58%);
    box-shadow: 0 18px 48px rgba(37, 61, 91, 0.08);
  }
  .literature-overview-card::before {
    content: '';
    position: absolute;
    inset: -45% -12% auto auto;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--primary) 14%, transparent), transparent 68%);
    pointer-events: none;
  }
  .literature-overview-inner { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border); }
  .literature-overview-main { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
  .literature-middle-col { min-width: 0; display: grid; grid-template-rows: minmax(260px, auto) minmax(190px, auto); gap: 1px; background: var(--border); }
  .literature-overview-panel { min-width: 0; padding: 24px; background: color-mix(in srgb, var(--card-bg) 96%, transparent); }
  .literature-checkin-panel { min-width: 0; padding: 24px; background: color-mix(in srgb, var(--card-bg) 96%, transparent); display: flex; flex-direction: column; }

  .knowledge-graph-tip { position: absolute; left: 14px; bottom: 14px; z-index: 3; max-width: min(600px, calc(100% - 28px)); padding: 8px 11px; border: 1px solid color-mix(in srgb, var(--primary) 16%, var(--border)); border-radius: 9px; background: color-mix(in srgb, var(--card-bg) 88%, transparent); color: var(--text-muted); font-size: 10px; line-height: 1.5; backdrop-filter: blur(14px); pointer-events: none; box-shadow: 0 8px 24px rgba(15, 20, 27, 0.06); }

  @keyframes graphLive { 0%, 100% { opacity: 0.65; transform: scale(0.88); } 50% { opacity: 1; transform: scale(1); } }

  /* Obsidian-inspired graph workspace */
  .knowledge-graph-card {

    --graph-accent: #7663cf;

  .graph-tool-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .knowledge-graph-stage { min-height: 560px; background: var(--graph-bg); }

  .knowledge-graph-empty {

    border-color: rgba(168,139,250,.28);

  }
  .graph-node-kicker { color: #b9a5f8; }
  .graph-node-metric { border-color: var(--graph-border); background: var(--graph-panel); color: var(--graph-muted); }
  .graph-node-placeholder-icon { color: #b9a5f8; background: rgba(168,139,250,.12); }
  .knowledge-graph-tip {
    border-color: var(--graph-border);
    border-radius: 6px;
    background: color-mix(in srgb, var(--graph-panel) 88%, transparent);

  .knowledge-graph-tooltip {

    inset: 0;
    z-index: calc(var(--z-toast) - 10);
    display: flex;
    flex-direction: column;

    height: 100dvh;

    margin: 0;
    border: 0;
    border-radius: 0;

  body.graph-fullscreen-open { overflow: hidden; }

  .note-reader-overlay { position: fixed; inset: 0; z-index: calc(var(--z-modal) + 20); background: var(--bg); display: none; flex-direction: column; }
  .note-reader-overlay.show { display: flex; animation: readerIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
  .note-reader-shell { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .note-reader-toolbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); padding: 14px clamp(16px, 3vw, 36px); border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--card-bg) 92%, transparent); backdrop-filter: blur(18px); }
  .note-reader-heading { min-width: 0; }
  .note-reader-kicker { font-size: var(--fs-micro); letter-spacing: 0.08em; color: var(--primary); font-weight: 700; }
  .note-reader-title { margin-top: 3px; font-size: var(--fs-body); font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-reader-actions { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
  .note-reader-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; padding: clamp(24px, 5vw, 64px) 20px 80px; scroll-behavior: smooth; }
  .note-reader-paper { width: min(860px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 58px); border: 1px solid var(--border); border-radius: var(--radius); background: var(--card-bg); box-shadow: var(--shadow); }
  .note-reader-source { padding-bottom: var(--sp-5); margin-bottom: var(--sp-6); border-bottom: 1px solid var(--border); }
  .note-reader-source-title { font-size: clamp(18px, 2.4vw, 26px); line-height: 1.45; font-weight: 650; color: var(--text-main); }
  .note-reader-source-meta { margin-top: var(--sp-2); font-size: var(--fs-caption); line-height: 1.7; color: var(--text-muted); }
  .note-reader-status { min-height: 20px; margin-bottom: var(--sp-3); font-size: var(--fs-caption); color: var(--text-muted); }
  .note-reader-content { color: var(--text-main); font-size: 16px; line-height: 1.9; overflow-wrap: anywhere; }
  .note-reader-content h1, .note-reader-content h2, .note-reader-content h3, .note-reader-content h4 { margin: 1.7em 0 0.7em; line-height: 1.4; color: var(--text-main); }
  .note-reader-content h1:first-child, .note-reader-content h2:first-child { margin-top: 0; }
  .note-reader-content p, .note-reader-content ul, .note-reader-content ol, .note-reader-content blockquote, .note-reader-content pre, .note-reader-content table { margin: 1em 0; }
  .note-reader-content img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
  .note-reader-content a { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
  .note-reader-content blockquote { padding: var(--sp-3) var(--sp-4); border-left: 3px solid var(--primary); background: var(--primary-soft); color: var(--text-sub); }
  .note-reader-content code { padding: 2px 5px; border-radius: 5px; background: var(--neutral-soft); font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note-reader-content pre { overflow-x: auto; padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--neutral-soft); }
  .note-reader-content pre code { padding: 0; background: transparent; }
  .note-reader-content table { width: 100%; border-collapse: collapse; font-size: var(--fs-small); }
  .note-reader-content th, .note-reader-content td { padding: 9px 10px; border: 1px solid var(--border); text-align: left; }
  .note-reader-content mjx-container { max-width: 100%; color: var(--text-main); vertical-align: -0.08em; }
  .note-reader-content mjx-container:not([display="true"]) { display: inline-block; margin: 0 0.1em; font-size: 1.02em; }
  .note-reader-content mjx-container svg { max-width: 100%; height: auto; overflow: visible; fill: currentColor; stroke: currentColor; }
  .note-reader-content .zotero-math-display { display: block; width: 100%; max-width: 100%; margin: 0; overflow: visible; text-align: center; }
  .note-reader-content .zotero-math-inline { display: inline; }
  .note-reader-content mjx-container[display="true"] {
    display: flex !important;
    justify-content: safe center;
    align-items: center;
    width: 100% !important;
    max-width: 100%;
    box-sizing: border-box;
    margin: 1.55em 0 !important;
    padding: 0.35em clamp(0.25em, 1.5vw, 0.65em);
    overflow-x: auto;
    overflow-y: hidden;
    font-size: 1.12em;
    line-height: 1.4;
    text-align: center !important;
    scrollbar-width: thin;
    scrollbar-gutter: stable both-edges;
  }
  .note-reader-content mjx-container[display="true"] > svg {
    display: block;
    flex: 0 0 auto;
    width: auto;
    max-width: none;
    margin: 0;
  }
  [data-theme="dark"] .note-reader-content mjx-container { color: #edf3fb; }
  @keyframes readerIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================================================
     FOCUS WORKSPACE PAGES
     Shared visual language for daily execution, fitness, and learning.
     ============================================================ */
  .workspace-page {
    --workspace-line: color-mix(in srgb, var(--primary) 12%, var(--border));

  }

  .fitness-page .workspace-hero { grid-template-columns: minmax(0, 1fr) minmax(460px, 560px); }
  .workspace-hero {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 26px;
    padding: 22px 24px; margin-bottom: 18px; border: 1px solid var(--workspace-line);
    border-radius: 16px; background: var(--card-bg); box-shadow: var(--shadow);
  }
  .workspace-kicker { display: flex; align-items: center; gap: 8px; color: var(--primary); font-size: var(--fs-micro); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .workspace-kicker::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .workspace-hero-title { margin-top: 10px; color: var(--text-main); font-size: 23px; font-weight: 720; line-height: 1.3; }
  .workspace-hero-copy { max-width: 58ch; margin-top: 8px; color: var(--text-sub); font-size: var(--fs-small); line-height: 1.7; }
